name: Ligar ou desligar o site

# Roda só quando você manda: Actions → "Ligar ou desligar o site" → Run workflow.
#   ligar     liga o GitHub Pages em modo legacy (publica a pasta raiz da main).
#             Depois disso, cada PR concluído na main atualiza o site sozinho.
#   desligar  desliga o GitHub Pages. O site sai do ar e nenhum merge na main
#             o reabre, porque sem Pages não há publicação.
# Não precisa de configuração manual: a fonte do Pages continua "main /".

on:
  workflow_dispatch:
    inputs:
      estado:
        description: "O que fazer com o site?"
        type: choice
        options:
          - ligar
          - desligar
        default: ligar

permissions:
  contents: read
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  alternar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      ESTADO: ${{ inputs.estado }}
    steps:
      - name: Ligar o site (Pages em main /)
        if: env.ESTADO == 'ligar'
        run: |
          if gh api "repos/$REPO/pages" >/dev/null 2>&1; then
            echo "Pages já está ligado; pedindo um build novo."
          else
            gh api -X POST "repos/$REPO/pages" \
              -f "source[branch]=main" -f "source[path]=/" -f build_type=legacy
            echo "Pages ligado em main /."
          fi
          gh api -X POST "repos/$REPO/pages/builds" >/dev/null
          echo "Build disparado. Em ~1 minuto o site está no ar."

      - name: Desligar o site (remover o Pages)
        if: env.ESTADO == 'desligar'
        run: |
          if gh api "repos/$REPO/pages" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$REPO/pages"
            echo "Pages desligado. O site saiu do ar."
          else
            echo "Pages já estava desligado; nada a fazer."
          fi
