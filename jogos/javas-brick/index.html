<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:,">
<title>Java's Brick 1.0.17</title>
<style>
  html, body { margin: 0; height: 100%; background: #07061a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<script>
/*==ENGINE:core==  JGK (Javarotti Game Kit) 2D · registros, save, canvas, entrada, cenas, loop */
// Motor JGK — Javarotti Game Kit. Cada jogo do time usa este mesmo núcleo.
const K = (window.K = window.K || {});
K.version = '1.0.17';
K.game = "Java's Brick";
K.W = 800;
K.H = 600;

// ---- registros (conteúdo chama estes; registrar de novo o mesmo id substitui) ----
K.worlds = {}; K.blocks = {}; K.powers = {}; K.levels = {}; K.songs = {}; K.stories = {};
K.credits = { extra: [] };
K.levelOrder = ['f1-1', 'f1-2', 'f1-3', 'f2-1', 'f2-2', 'f2-3', 'f3-1', 'f3-2', 'f3-3', 'f4-1', 'f4-2', 'f4-3'];
K.defWorld = (id, d) => (K.worlds[id] = Object.assign({ id }, d));
K.defBlock = (id, d) => (K.blocks[id] = Object.assign({ id, hp: 1, score: 10 }, d));
K.defPower = (id, d) => (K.powers[id] = Object.assign({ id, good: true }, d));
K.defLevel = (id, d) => (K.levels[id] = Object.assign({ id }, d));
K.defSong = (id, d) => (K.songs[id] = Object.assign({ id }, d));
K.defStory = (id, d) => (K.stories[id] = Object.assign({ id }, d));
K.defCredits = (d) => Object.assign(K.credits, d);

// ---- save local (try/catch: pode faltar em aba privada) ----
K.KEY = 'quebra-tijolos-1';
function K_defaultSave() {
  return { unlocked: { 'f1-1': true }, best: {}, done: {}, opts: { music: 0.6, sfx: 0.8, gfx: 'auto' } };
}
K.save = (function () {
  try {
    const s = JSON.parse(localStorage.getItem(K.KEY));
    if (s && s.unlocked) return Object.assign(K_defaultSave(), s);
  } catch (e) { /* sem storage: segue com o padrão */ }
  return K_defaultSave();
})();
K.store = function () {
  try { localStorage.setItem(K.KEY, JSON.stringify(K.save)); } catch (e) { /* ignora */ }
};
// Zerar progresso mantém as opções (regra 18)
K.resetProgress = function () {
  const opts = K.save.opts;
  K.save = K_defaultSave();
  K.save.opts = opts;
  K.store();
};

// ---- canvas, escala e letterbox ----
K.cv = document.getElementById('c');
K.g = K.cv.getContext('2d');
// ---- gráficos: 0 baixo, 1 médio, 2 alto. "Automático" só ajusta K.q na memória (regra 13) ----
K.gfxModes = ['auto', 'baixo', 'medio', 'alto'];
K.autoQ = 2;            // nível que o automático escolheu agora (não é salvo)
K.q = 2;                // nível efetivo que o jogo usa
K.setQuality = function () {
  const m = K.save.opts.gfx || 'auto';
  K.q = m === 'auto' ? K.autoQ : ({ baixo: 0, medio: 1, alto: 2 })[m];
};
K.gfxName = function () {
  return ({ auto: 'Automático', baixo: 'Baixo', medio: 'Médio', alto: 'Alto' })[K.save.opts.gfx || 'auto'];
};
K.cycleGfx = function () {
  const i = K.gfxModes.indexOf(K.save.opts.gfx || 'auto');
  K.save.opts.gfx = K.gfxModes[(i + 1) % K.gfxModes.length];
  K.store();
  K.setQuality();
  K.fit();
};
K.perf = { acc: 0, n: 0 };
// mede o tempo de quadro; no automático, cai um nível se ficar lento e sobe se sobrar folga
K.frameSample = function (dt) {
  if ((K.save.opts.gfx || 'auto') !== 'auto') return;
  K.perf.acc += dt; K.perf.n++;
  if (K.perf.n < 90) return;
  const avg = K.perf.acc / K.perf.n;
  if (avg > 0.026 && K.autoQ > 0) K.autoQ--;
  else if (avg < 0.013 && K.autoQ < 2) K.autoQ++;
  K.perf = { acc: 0, n: 0 };
  const before = K.q;
  K.setQuality();
  if (K.q !== before) K.fit();
};

// ---- tela cheia (F ou botão nas opções; precisa de um toque/tecla do jogador) ----
K.isFull = function () { return !!document.fullscreenElement; };
K.toggleFull = function () {
  try {
    if (K.isFull()) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  } catch (e) { /* navegador sem tela cheia: segue normal */ }
};
// como no Pedrada: o botão de menu entra em tela cheia (sem barra do navegador) e, no celular, gira para paisagem
K.fullscreen = function () {
  try {
    const d = document.documentElement;
    if (!document.fullscreenElement && d.requestFullscreen) {
      d.requestFullscreen({ navigationUI: 'hide' }).then(() => {
        try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) { /* sem orientação: segue */ }
      }).catch(() => {});
    }
  } catch (e) { /* navegador sem tela cheia */ }
};
// ícone de tela cheia no canto superior direito dos menus: sempre visível e some já em tela cheia (regra 33)
K.fsIcon = function (g) {
  if (K.isFull()) return;
  const x = K.W - 74, y = 14, w = 58, h = 58;
  K.buttons.push({ x, y, w, h, fn: () => K.fullscreen() });
  const focused = K.buttons.length - 1 === K.focus;
  g.save();
  g.fillStyle = 'rgba(12,8,30,0.72)';
  g.beginPath(); g.roundRect(x, y, w, h, 14); g.fill();
  g.beginPath(); g.roundRect(x, y, w, h, 14);
  g.strokeStyle = focused ? '#ffd23f' : 'rgba(255,255,255,0.5)';
  g.lineWidth = focused ? 3 : 2; g.stroke();
  const cx = x + w / 2, cy = y + h / 2;
  g.strokeStyle = '#fff7d6'; g.lineWidth = 4; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath();
  for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
    g.moveTo(cx + sx * 7, cy + sy * 18); g.lineTo(cx + sx * 18, cy + sy * 18); g.lineTo(cx + sx * 18, cy + sy * 7);
  }
  g.stroke();
  g.restore();
};
document.addEventListener('fullscreenchange', () => K.fit());

// layout lógico: em paisagem (mais larga que 4:3) menus e fase usam o formato real da tela
// (altura menor 520 + largura maior => tudo fica maior e preenche o celular deitado); senão 800x600
K.layout = function () {
  const a = window.innerWidth / Math.max(1, window.innerHeight);
  if (a > 1.34) {
    K.H = 520;
    K.W = Math.max(800, Math.min(1120, Math.round(520 * a)));
  } else { K.W = 800; K.H = 600; }
};
K.wide = function () { return K.H < 600; };   // layout widescreen ativo
K.ox = function () { return (K.W - 800) / 2; };   // folga lateral para conteúdo desenhado em 800 de largura
K.fit = function () {
  K.lastW = window.innerWidth; K.lastH = window.innerHeight;
  K.layout();
  const s = Math.min(window.innerWidth / K.W, window.innerHeight / K.H);
  const cssW = Math.floor(K.W * s), cssH = Math.floor(K.H * s);
  K.cv.style.width = cssW + 'px';
  K.cv.style.height = cssH + 'px';
  const cap = K.q === 2 ? 2 : K.q === 1 ? 1.5 : 1;
  const dpr = Math.min(cap, window.devicePixelRatio || 1);
  K.cv.width = Math.round(cssW * dpr);
  K.cv.height = Math.round(cssH * dpr);
  K.g.setTransform(K.cv.width / K.W, 0, 0, K.cv.height / K.H, 0, 0);
};
window.addEventListener('resize', K.fit);

// ---- entrada: ponteiro/toque, teclado ----
K.in = { x: 400, y: 300, down: false, active: false, keys: {} };
K.buttons = [];   // botões desenhados neste quadro: {x,y,w,h,fn}
K.focus = 0;      // botão focado pelo teclado
function K_toL(e) {
  const r = K.cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * K.W, y: (e.clientY - r.top) / r.height * K.H };
}
K.cv.addEventListener('pointerdown', (e) => {
  const p = K_toL(e);
  K.in.x = p.x; K.in.y = p.y; K.in.active = true; K.in.down = true;
  try { K.cv.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
  AU.init();
  e.preventDefault();
  if (K.cur && K.cur.press) K.cur.press(p.x, p.y);
});
K.cv.addEventListener('pointermove', (e) => {
  const p = K_toL(e);
  K.in.x = p.x; K.in.y = p.y; K.in.active = true;
});
window.addEventListener('pointerup', (e) => {
  if (!K.in.down) return;
  K.in.down = false;
  const p = K_toL(e);
  K_activate(p.x, p.y);
});
function K_activate(x, y) {
  const b = K.buttons.find((q) => x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h);
  if (b) { K.focus = K.buttons.indexOf(b); AU.sfx('click'); b.fn(); return; }
  if (K.cur && K.cur.tap) K.cur.tap(x, y);
}
// ---- navegação por teclado (regra 32 do time) ----
// setas ou WASD movem o foco entre botões pela geometria da tela; espaço ou Enter selecionam; Backspace volta.
// Cenas de jogo (cena com free() verdadeiro) usam as setas e o espaço livremente para a raquete.
const K_DIR = { ArrowUp: 'u', w: 'u', W: 'u', ArrowDown: 'd', s: 'd', S: 'd', ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r' };
K.moveFocus = function (d) {
  const bs = K.buttons;
  if (!bs.length) return;
  const cur = bs[K.focus] || bs[0];
  const cx = cur.x + cur.w / 2, cy = cur.y + cur.h / 2;
  const vert = d === 'u' || d === 'd';
  let best = -1, bestScore = Infinity;
  bs.forEach((b, i) => {
    if (i === K.focus) return;
    const dx = b.x + b.w / 2 - cx, dy = b.y + b.h / 2 - cy;
    const ok = d === 'u' ? dy < -4 : d === 'd' ? dy > 4 : d === 'l' ? dx < -4 : dx > 4;
    if (!ok) return;
    const main = vert ? Math.abs(dy) : Math.abs(dx);
    const cross = vert ? Math.abs(dx) : Math.abs(dy);
    const score = main + cross * 2;
    if (score < bestScore) { bestScore = score; best = i; }
  });
  if (best < 0) best = (d === 'd' || d === 'r') ? (K.focus + 1) % bs.length : (K.focus - 1 + bs.length) % bs.length;
  K.focus = best;
  AU.sfx('click');
};
// Backspace: volta para a tela anterior (cada cena pode definir back())
K.back = function () {
  if (!K.cur) return;
  if (K.cur.back) K.cur.back();
  else if (K.cur !== K.scenes.title) K.go('title');
};
window.addEventListener('keydown', (e) => {
  AU.init();
  const k = e.key;
  if (k === 'f' || k === 'F') { K.toggleFull(); return; }   // tela cheia em qualquer cena (regra 26)
  K.in.keys[k] = true;
  if (k === 'Backspace') { e.preventDefault(); K.back(); return; }
  const free = !!(K.cur && K.cur.free && K.cur.free());
  if (!free) {
    const d = K_DIR[k];
    if (d && K.buttons.length) { e.preventDefault(); K.moveFocus(d); return; }
    if ((k === 'Enter' || k === ' ') && K.buttons.length) {
      e.preventDefault();
      const b = K.buttons[K.focus] || K.buttons[0];
      if (b) { AU.sfx('click'); b.fn(); }
      return;
    }
  }
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(k)) e.preventDefault();
  if (k === 'ArrowLeft' || k === 'ArrowRight') K.in.active = false;
  if (K.cur && K.cur.key) K.cur.key(k);
});
window.addEventListener('keyup', (e) => { delete K.in.keys[e.key]; });

// jogo no navegador: sem menu do botão direito (nada de "Guardar imagem" ou "Inspecionar" no meio da partida)
window.addEventListener('contextmenu', (e) => e.preventDefault());

// ---- cenas ----
K.scenes = {};
K.cur = null;
K.defScene = (id, s) => (K.scenes[id] = s);
K.go = function (id, arg) {
  if (K.cur && K.cur.leave) K.cur.leave();
  K.cur = K.scenes[id];
  K.focus = 0;
  K.fit();
  if (K.cur && K.cur.enter) K.cur.enter(arg);
};

// botão genérico (desenha e registra para toque/teclado)
K.btn = function (g, x, y, w, h, label, fn, opt) {
  opt = opt || {};
  const idx = K.buttons.length;
  const focused = idx === K.focus;
  K.buttons.push({ x, y, w, h, fn });
  g.save();
  const grad = g.createLinearGradient(0, y, 0, y + h);
  grad.addColorStop(0, opt.top || '#ffe9a6');
  grad.addColorStop(1, opt.bot || '#f3b33d');
  g.fillStyle = grad;
  g.beginPath(); g.roundRect(x, y, w, h, 12); g.fill();
  g.lineWidth = focused ? 4 : 2;
  g.strokeStyle = focused ? '#ffffff' : (opt.edge || '#3b2350');
  g.stroke();
  g.fillStyle = opt.ink || '#2b1740';
  g.font = 'bold ' + (opt.size || 22) + 'px system-ui, Segoe UI, Arial';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(label, x + w / 2, y + h / 2 + 1);
  g.restore();
};

// ---- loop: passo fixo nas cenas que pedem; update(dt) e draw(g) ----
let K_last = performance.now();
function K_frame(now) {
  const dt = Math.min(0.05, (now - K_last) / 1000);
  K_last = now;
  // responsivo: se a janela mudou de tamanho (inclusive sem evento de resize), reajusta o canvas
  if (window.innerWidth !== K.lastW || window.innerHeight !== K.lastH) K.fit();
  K.buttons = K.buttons.length ? K.buttons : [];
  K.buttons.length = 0;
  if (K.cur) {
    K.frameSample(dt);
    if (K.cur.update) K.cur.update(dt);
    K.g.setTransform(K.cv.width / K.W, 0, 0, K.cv.height / K.H, 0, 0);
    K.cur.draw(K.g);
  }
  requestAnimationFrame(K_frame);
}

// ---- texto e painel com contraste garantido (regra 29 do time): nunca texto claro solto sobre fundo claro ----
// K.txt desenha texto com contorno escuro (funciona em qualquer fundo). Use sempre no lugar de fillText.
K.txt = function (g, s, x, y, o) {
  o = o || {};
  g.save();
  g.font = o.font || '18px system-ui, Segoe UI, Arial';
  g.textAlign = o.align || 'center';
  g.textBaseline = o.base || 'middle';
  g.lineJoin = 'round';
  g.lineWidth = o.halo || 4;
  g.strokeStyle = o.haloColor || 'rgba(10,6,24,0.9)';
  g.strokeText(s, x, y);
  g.fillStyle = o.color || '#ffffff';
  g.fillText(s, x, y);
  g.restore();
};
// K.panel: caixa escura translúcida atrás de blocos de texto
K.panel = function (g, x, y, w, h, r) {
  g.save();
  g.fillStyle = 'rgba(12,8,30,0.82)';
  g.beginPath(); g.roundRect(x, y, w, h, r || 18); g.fill();
  g.restore();
};

// ---- utilidades ----
K.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
K.rnd = (a, b) => a + Math.random() * (b - a);
K.pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
K.fmt = (n) => String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');

// ---- depuração (regra 21): atalhos de teste ----
K.debug = {
  go: (id, arg) => K.go(id, arg),
  unlockAll: () => { K.levelOrder.forEach((id) => (K.save.unlocked[id] = true)); K.store(); },
  state: () => (K.play && K.play.state ? K.play.state() : null),
};

;
/*==ENGINE:audio==  JGK · sintetizador WebAudio, tocador de padrões de texto, efeitos; para ao perder o foco (regra 15) */
const AU = (K.au = { ctx: null, music: null, sfxBus: null, musicBus: null, noise: null, timer: null, step: 0, nextT: 0, song: null });

AU.init = function () {
  try {
    if (!AU.ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      AU.ctx = new C();
      AU.musicBus = AU.ctx.createGain();
      AU.sfxBus = AU.ctx.createGain();
      AU.musicBus.connect(AU.ctx.destination);
      AU.sfxBus.connect(AU.ctx.destination);
      const n = AU.ctx.createBuffer(1, AU.ctx.sampleRate * 0.5, AU.ctx.sampleRate);
      const d = n.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      AU.noise = n;
      AU.setVol();
    }
    if (AU.ctx.state === 'suspended' && AU.foreground !== false) AU.ctx.resume();
  } catch (e) { /* sem áudio: o jogo segue mudo */ }
};

// volumes vêm das opções salvas (nunca gravados pela automação)
AU.setVol = function () {
  if (!AU.ctx) return;
  AU.musicBus.gain.value = 0.22 * K.save.opts.music;
  AU.sfxBus.gain.value = 0.5 * K.save.opts.sfx;
};

// perder o foco: suspende tudo; voltar: retoma (regra 15)
AU.sleep = function () { AU.foreground = false; if (AU.ctx && AU.ctx.state === 'running') AU.ctx.suspend(); };
// só volta a tocar com a janela de fato focada e visível (nunca por evento isolado)
AU.focused = function () { return !document.hidden && (!document.hasFocus || document.hasFocus()); };
AU.wake = function () {
  if (!AU.focused()) return;
  AU.foreground = true;
  if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume();
};

const AU_SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
AU.freq = function (n) {
  const m = /^([A-G])(#|b)?([0-8])$/.exec(n);
  if (!m) return 0;
  let semi = AU_SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  const midi = (parseInt(m[3], 10) + 1) * 12 + semi;
  return 440 * Math.pow(2, (midi - 69) / 12);
};

AU.tone = function (f, dur, when, type, vol, bus) {
  const c = AU.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type || 'triangle';
  o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(vol, when + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g); g.connect(bus);
  o.start(when); o.stop(when + dur + 0.05);
};
AU.noiseHit = function (dur, when, vol, hp, bus) {
  const c = AU.ctx, s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
  s.buffer = AU.noise; f.type = 'highpass'; f.frequency.value = hp;
  g.gain.setValueAtTime(vol, when);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  s.connect(f); f.connect(g); g.connect(bus);
  s.start(when, Math.random() * 0.3); s.stop(when + dur + 0.05);
};
AU.kick = function (when, vol) {
  const c = AU.ctx, o = c.createOscillator(), g = c.createGain();
  o.frequency.setValueAtTime(140, when); o.frequency.exponentialRampToValueAtTime(40, when + 0.12);
  g.gain.setValueAtTime(vol, when); g.gain.exponentialRampToValueAtTime(0.0001, when + 0.2);
  o.connect(g); g.connect(AU.musicBus); o.start(when); o.stop(when + 0.22);
};

// ---- tocador de músicas (um token = uma semicolcheia; ver docs/ENGINE_API.md) ----
AU.play = function (songId) {
  AU.init();
  AU.stop();
  const def = K.songs[songId];
  if (!def || !AU.ctx) return;
  const tok = (s) => (s || '').trim().split(/\s+/).filter(Boolean);
  AU.song = {
    lead: tok(def.lead), bass: tok(def.bass), drums: tok(def.drums),
    len: tok(def.lead).length, stepDur: 60 / def.bpm / 4,
    wave: Object.assign({ lead: 'triangle', bass: 'sine' }, def.wave || {}),
  };
  AU.step = 0;
  AU.nextT = AU.ctx.currentTime + 0.05;
  AU.timer = setInterval(AU.tick, 25);
};
AU.tick = function () {
  const s = AU.song;
  if (!s || !AU.ctx) return;
  // se a aba ficou em segundo plano, o relógio andou sem o agendador: não tocar as notas atrasadas
  // de uma vez (isso soava como barulho ao voltar). Recomeça do instante atual.
  if (AU.nextT < AU.ctx.currentTime) AU.nextT = AU.ctx.currentTime + 0.05;
  if (AU.ctx.state !== 'running') return;
  while (AU.nextT < AU.ctx.currentTime + 0.12) {
    const i = AU.step % s.len, t = AU.nextT;
    const l = s.lead[i], b = s.bass[i], d = s.drums[i];
    if (l && l !== '.') AU.tone(AU.freq(l), s.stepDur * 0.9, t, s.wave.lead, 0.5, AU.musicBus);
    if (b && b !== '.') AU.tone(AU.freq(b), s.stepDur * 1.8, t, s.wave.bass, 0.6, AU.musicBus);
    if (d === 'k') AU.kick(t, 0.9);
    if (d === 's') AU.noiseHit(0.16, t, 0.5, 1200, AU.musicBus);
    if (d === 'h') AU.noiseHit(0.04, t, 0.22, 6000, AU.musicBus);
    AU.step++;
    AU.nextT += s.stepDur;
  }
};
AU.stop = function () {
  if (AU.timer) clearInterval(AU.timer);
  AU.timer = null; AU.song = null;
};

// ---- efeitos ----
AU.sfx = function (name) {
  if (!AU.ctx || !AU.sfxBus || AU.ctx.state !== 'running') return;
  const t = AU.ctx.currentTime, b = AU.sfxBus;
  switch (name) {
    case 'hit': AU.tone(660, 0.08, t, 'triangle', 0.5, b); break;
    case 'wall': AU.tone(220, 0.05, t, 'sine', 0.3, b); break;
    case 'paddle': AU.tone(330, 0.1, t, 'square', 0.35, b); break;
    case 'break': AU.noiseHit(0.14, t, 0.6, 2000, b); AU.tone(990, 0.1, t, 'square', 0.25, b); break;
    case 'boom': AU.noiseHit(0.4, t, 0.9, 80, b); AU.tone(90, 0.35, t, 'sawtooth', 0.4, b); break;
    case 'power': [523, 659, 784, 1047].forEach((f, i) => AU.tone(f, 0.12, t + i * 0.05, 'triangle', 0.4, b)); break;
    case 'laser': AU.tone(1200, 0.12, t, 'sawtooth', 0.15, b); break;
    case 'shield': AU.tone(440, 0.4, t, 'sine', 0.4, b); break;
    case 'life': [784, 988, 1175].forEach((f, i) => AU.tone(f, 0.15, t + i * 0.08, 'triangle', 0.4, b)); break;
    case 'lose': AU.tone(392, 0.5, t, 'sawtooth', 0.4, b); AU.tone(196, 0.6, t + 0.2, 'sawtooth', 0.4, b); break;
    case 'win': [523, 659, 784, 1047, 1319].forEach((f, i) => AU.tone(f, 0.2, t + i * 0.09, 'square', 0.3, b)); break;
    case 'click': AU.tone(880, 0.03, t, 'sine', 0.25, b); break;
    case 'launch': AU.tone(300, 0.12, t, 'triangle', 0.35, b); AU.tone(600, 0.12, t + 0.06, 'triangle', 0.25, b); break;
    default: break;
  }
};

/*==ENGINE:play==  JGK · jogo de quebra-tijolos: física, blocos, poderes, Núcleo, desenho da fase */
const PL = (K.play = {});
// grade: 12 colunas por padrão; fases avançadas podem usar até 20 (mosaicos de palavras)
let PL_COLS = 12, PL_CW = 64, PL_CH = 30, PL_X0 = 16, PL_Y0 = 84, PL_BW = 56, PL_BH = 22;
const PL_PH = 14;                         // raquete (a altura do centro dela é K.H - 44)
const PL_STEP = 1 / 120;                  // passo fixo
const PL_DEFAULT_LEGEND = {
  '1': 'basico', '2': 'dupla', '3': 'tripla', '#': 'indestrutivel', '*': 'explosivo', G: 'nucleo',
};
const PL_DROP_TABLE = [
  ['multi', 14], ['laser', 12], ['fire', 10], ['sticky', 10], ['wide', 12],
  ['narrow', 6], ['shield', 8], ['slow', 10], ['bonus', 10], ['vida', 4],
];
const PL_DROP_TOTAL = PL_DROP_TABLE.reduce((a, b) => a + b[1], 0);

PL.G = null;
PL.order = K.levelOrder;

// ---- início de fase ----
PL.start = function (levelId) {
  const def = K.levels[levelId];
  if (!def) return;
  const legend = Object.assign({}, PL_DEFAULT_LEGEND, def.legend || {});
  // grade da fase: a largura total fica em 768 px, então blocos menores em fases mais largas
  PL_COLS = Math.min(20, Math.max(1, def.cols || 12));
  PL_CW = Math.floor(768 / PL_COLS);
  PL_BW = PL_CW - 8;
  PL_X0 = Math.floor((K.W - PL_CW * PL_COLS) / 2);
  const bricks = [];
  def.rows.forEach((row, r) => {
    for (let c = 0; c < PL_COLS; c++) {
      const ch = row[c];
      if (!ch || ch === '.') continue;
      const L = legend[ch];
      const bname = typeof L === 'string' ? L : L && L.block;
      const bd = K.blocks[bname];
      if (!bd) continue;
      const hp = bd.hp;
      bricks.push({
        c, r, id: bname, def: bd, hp, maxHp: hp, dead: false, flash: 0,
        letter: L && L.letter, move: bd.move || null,
        baseX: PL_X0 + c * PL_CW + 4,
        y: PL_Y0 + r * PL_CH,
        x: PL_X0 + c * PL_CW + 4,
      });
    }
  });
  const world = K.worlds[def.world] || { sky: ['#1b2a4a', '#0b1020'], accent: '#7cc24a', paddle: '#f2c230', ball: '#ffffff' };
  PL.G = {
    id: levelId, def, world, tune: Object.assign({ speed: 1, drop: 0.15, lives: 3 }, def.tune || {}),
    bricks, balls: [], drops: [], bullets: [], parts: [], floats: [],
    paddle: { x: K.W / 2, w: 110 }, vw: K.W, lives: 0, score: 0, timers: {}, shield: 0,
    t: 0, mode: 'ready', modeT: 0, shake: 0, hits: 0, msg: '', msgT: 0,
    sticky: false, laserCd: 0, acc: 0, paused: false,
  };
  PL.G.lives = PL.G.tune.lives;
  PL.G.total = bricks.filter((b) => b.hp !== Infinity).length;
  PL.G.broken = 0;
  PL.spawnBall(true);
  AU.play(def.song);
};

PL.spawnBall = function (stuck, x, y, vx, vy) {
  const G = PL.G;
  G.balls.push({
    x: x === undefined ? G.paddle.x : x, y: y === undefined ? (K.H - 44) - 12 : y,
    vx: vx || 0, vy: vy || 0, r: 7, stuck: !!stuck, ox: 0,
  });
};

PL.speed = function () {
  const G = PL.G;
  // velocidade cresce com o progresso da fase: +60% quando todos os blocos quebráveis caem
  const prog = G.total ? (G.broken || 0) / G.total : 0;
  let s = 330 * G.tune.speed * (1 + 0.6 * prog);
  if (G.timers.slow > 0) s *= 0.65;
  return s;
};

PL.launch = function () {
  const G = PL.G;
  let any = false;
  G.balls.forEach((b) => {
    if (!b.stuck) return;
    any = true;
    b.stuck = false;
    const s = PL.speed();
    const a = (-Math.PI / 2) + K.rnd(-0.35, 0.35) * (b.ox / 40 + 0.001 > 0 ? 1 : 1);
    b.vx = Math.cos(a) * s; b.vy = Math.sin(a) * s;
  });
  if (any) { AU.sfx('launch'); G.mode = 'play'; }
};

// ---- poderes ----
PL.apply = function (id) {
  const G = PL.G;
  AU.sfx(id === 'vida' ? 'life' : 'power');
  const say = (txt) => { G.msg = txt; G.msgT = 1.6; };
  switch (id) {
    case 'multi': {
      const cur = G.balls.filter((b) => !b.stuck);
      const base = cur.length ? cur : G.balls;
      base.slice(0, 4).forEach((b) => {
        for (let k = -1; k <= 1; k += 2) {
          const s = PL.speed(), a = Math.atan2(b.vy, b.vx) + k * 0.45;
          if (G.balls.length < 14) PL.spawnBall(false, b.x, b.y, Math.cos(a) * s, Math.sin(a) * s);
        }
      });
      if (!cur.length) PL.spawnBall(true);
      say('Chuva de Sóis! bolas extras');
      break;
    }
    case 'laser': G.timers.laser = 10; say('Lança-Cometa: a raquete atira'); break;
    case 'fire': G.timers.fire = 6; say('Raio Quark: bola atravessa a pancada'); break;
    case 'sticky': G.timers.sticky = 10; say('Ímã Estelar: a bola gruda na raquete'); break;
    case 'wide': G.timers.wide = 10; G.timers.narrow = 0; say('Expansão Nebulosa!'); break;
    case 'narrow': G.timers.narrow = 8; G.timers.wide = 0; say('Encolhe-Pacote: raquete menor'); break;
    case 'shield': G.shield = 1; G.timers.shield = 15; say('Escudo Aurora: uma queda evitada'); break;
    case 'slow': G.timers.slow = 8; say('Tempo de Mel: bola mais lenta'); break;
    case 'bonus': G.timers.bonus = 10; say('Bônus Dourado: pontos em dobro'); break;
    case 'vida': G.lives = Math.min(5, G.lives + 1); say('Coração Pixel: +1 vida'); break;
    default: break;
  }
};

// sorteio com bom senso: vida e escudo aparecem mais quando sobra só uma vida;
// o poder de encolher não cai se a raquete já está estreita; multi cai mais quando há uma bola só
PL.pickDrop = function () {
  const G = PL.G;
  const table = PL_DROP_TABLE.map(([id, w]) => {
    let k = 1;
    // só cai o que faz sentido agora: nada que já está ativo, nem excesso de bolas
    if (G.lives <= 1 && (id === 'vida' || id === 'shield')) k = 3;
    if (id === 'narrow' && G.timers.narrow > 0) k = 0;
    if (id === 'wide' && G.timers.wide > 0) k = 0;
    if (id === 'laser' && G.timers.laser > 0) k = 0;
    if (id === 'fire' && G.timers.fire > 0) k = 0;
    if (id === 'sticky' && G.timers.sticky > 0) k = 0;
    if (id === 'slow' && G.timers.slow > 0) k = 0;
    if (id === 'bonus' && G.timers.bonus > 0) k = 0;
    if (id === 'shield' && G.shield > 0) k = 0;
    if (id === 'vida' && G.lives >= 5) k = 0;
    if (id === 'multi') k = G.balls.length === 1 ? 1.5 : G.balls.length >= 4 ? 0 : 1;
    return [id, w * k];
  });
  const total = table.reduce((a, b) => a + b[1], 0);
  let roll = Math.random() * total;
  for (const [id, w] of table) { roll -= w; if (roll <= 0) return id; }
  return 'multi';
};

PL.brickX = function (b) {
  if (!b.move) return b.baseX;
  const x = b.baseX + Math.sin(PL.G.t * b.move.speed) * b.move.amp;
  return K.clamp(x, 4, K.W - 4 - PL_BW);
};

PL.breakable = function (b) { return !b.dead && b.hp !== Infinity; };

// dano em um bloco; retorna true se quebrou
PL.damage = function (b, source) {
  const G = PL.G;
  if (b.dead) return false;
  if (b.hp === Infinity) { b.flash = 0.25; AU.sfx('wall'); return false; }
  b.hp -= 1;
  b.flash = 1;
  if (b.hp > 0) { AU.sfx('hit'); return false; }
  PL.destroy(b, source);
  return true;
};

PL.destroy = function (b, source) {
  const G = PL.G;
  b.dead = true;
  const mult = G.timers.bonus > 0 ? 2 : 1;
  G.score += (b.def.score || 10) * mult;
  G.hits += 1;
  G.broken = (G.broken || 0) + 1;
  G.sinceBreak = 0;
  // a bola acelera a cada bloco quebrado (gradual, não só no quique)
  G.balls.forEach((ball) => { if (!ball.stuck) PL.speedUp(ball); });
  PL.burst(PL.brickX(b) + PL_BW / 2, b.y + PL_BH / 2, G.world.accent, 14);
  G.floats.push({ x: PL.brickX(b) + PL_BW / 2, y: b.y, txt: '+' + (b.def.score || 10) * mult, t: 0.8 });
  AU.sfx('break');
  if (b.id === 'explosivo') {
    AU.sfx('boom');
    G.shake = 0.25;
    G.bricks.forEach((o) => {
      if (o.dead || o.hp === Infinity) return;
      if (Math.abs(o.c - b.c) <= 1 && Math.abs(o.r - b.r) <= 1) {
        o.hp = 1; PL.damage(o, 'boom');
      }
    });
  }
  if (b.id === 'nucleo') G.shake = 0.4;
  // no máximo duas quedas na tela ao mesmo tempo, para não virar bagunça
  if (Math.random() < G.tune.drop && G.drops.length < 2) {
    G.drops.push({ x: PL.brickX(b) + PL_BW / 2, y: b.y + PL_BH / 2, id: PL.pickDrop(), t: 0 });
  }
};

PL.burst = function (x, y, color, n) {
  const G = PL.G;
  n = Math.round(n * [0.4, 0.7, 1][K.q]);   // menos partículas nos gráficos baixos
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = K.rnd(60, 220);
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: K.rnd(0.3, 0.6), c: color });
  }
};

// ---- passo de física ----
PL.step = function (dt) {
  const G = PL.G;
  G.t += dt;
  // anti-travamento: 20 s sem quebrar bloco e a bola está num ciclo; muda o ângulo dela
  G.sinceBreak = (G.sinceBreak || 0) + dt;
  if (G.sinceBreak > 20) {
    G.sinceBreak = 0;
    const sp = PL.speed();
    G.balls.forEach((ball) => {
      if (ball.stuck) return;
      ball.vx = (Math.random() < 0.5 ? -1 : 1) * sp * 0.6;
      ball.vy = (ball.vy < 0 ? -1 : 1) * Math.sqrt(Math.max(0, sp * sp - ball.vx * ball.vx));
    });
  }
  // tela girou / mudou de formato no meio da fase: recentraliza tudo na nova largura
  if (G.vw !== K.W) {
    const dx = (K.W - G.vw) / 2;
    G.bricks.forEach((b) => { b.baseX += dx; b.x += dx; });
    [G.balls, G.drops, G.bullets, G.parts, G.floats].forEach((l) => l.forEach((o) => { o.x += dx; }));
    G.paddle.x += dx; PL_X0 += dx; G.vw = K.W;
  }
  for (const k of Object.keys(G.timers)) if (G.timers[k] > 0) G.timers[k] -= dt;
  G.timers.shield = G.timers.shield || 0;
  if (G.timers.shield <= 0) G.shield = 0;
  // raquete: segue o ponteiro se ele estiver ativo, senão teclado
  const w = G.timers.wide > 0 ? 160 : G.timers.narrow > 0 ? 70 : 110;
  G.paddle.w = w;
  if (K.in.keys['ArrowLeft'] || K.in.keys['a']) { G.paddle.x -= 640 * dt; K.in.active = false; }
  if (K.in.keys['ArrowRight'] || K.in.keys['d']) { G.paddle.x += 640 * dt; K.in.active = false; }
  if (K.in.active) G.paddle.x = K.in.x;
  G.paddle.x = K.clamp(G.paddle.x, w / 2, K.W - w / 2);
  // tiro da raquete
  if (G.timers.laser > 0) {
    G.laserCd -= dt;
    if (G.laserCd <= 0) {
      G.laserCd = 0.35;
      G.bullets.push({ x: G.paddle.x - w / 2 + 8, y: (K.H - 44) - 10 });
      G.bullets.push({ x: G.paddle.x + w / 2 - 8, y: (K.H - 44) - 10 });
      AU.sfx('laser');
    }
  }
  // blocos móveis
  G.bricks.forEach((b) => { if (!b.dead) b.x = PL.brickX(b); if (b.flash > 0) b.flash = Math.max(0, b.flash - dt * 4); });
  // bolas
  const s = PL.speed();
  for (let i = G.balls.length - 1; i >= 0; i--) {
    const b = G.balls[i];
    if (b.stuck) { b.x = G.paddle.x + b.ox; b.y = (K.H - 44) - PL_PH / 2 - b.r - 1; continue; }
    const px = b.x, py = b.y;
    b.x += b.vx * dt; b.y += b.vy * dt;
    // paredes e teto
    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); AU.sfx('wall'); }
    if (b.x > K.W - b.r) { b.x = K.W - b.r; b.vx = -Math.abs(b.vx); AU.sfx('wall'); }
    if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); AU.sfx('wall'); }
    // raquete
    const pl = G.paddle.x - w / 2 - b.r * 0.5, pr = G.paddle.x + w / 2 + b.r * 0.5;
    if (b.vy > 0 && b.y + b.r >= (K.H - 44) - PL_PH / 2 && py + b.r <= (K.H - 44) - PL_PH / 2 + 4 && b.x >= pl && b.x <= pr) {
      if (G.sticky || G.timers.sticky > 0) {
        b.stuck = true; b.ox = b.x - G.paddle.x; b.vx = 0; b.vy = 0;
        AU.sfx('paddle');
        continue;
      }
      const off = K.clamp((b.x - G.paddle.x) / (w / 2), -1, 1);
      const vx = s * 0.95 * off;
      const vy = -Math.sqrt(Math.max(s * s * 0.12, s * s - vx * vx));
      b.vx = vx || (Math.random() < 0.5 ? -1 : 1) * 0.001; b.vy = vy;
      PL.guardAngle(b);
      b.y = (K.H - 44) - PL_PH / 2 - b.r;
      AU.sfx('paddle');
    }
    // queda
    if (b.y > K.H + b.r) {
      if (G.shield > 0) {
        G.shield -= 1; b.y = K.H - 14 - b.r; b.vy = -Math.abs(b.vy);
        AU.sfx('shield');
        G.msg = 'Escudo Aurora segurou a bola!'; G.msgT = 1.2;
        continue;
      }
      G.balls.splice(i, 1);
      continue;
    }
    // blocos (uma colisão por passo)
    let hit = false;
    for (const br of G.bricks) {
      if (br.dead) continue;
      const bx = br.x, by = br.y;
      const cx = K.clamp(b.x, bx, bx + PL_BW), cy = K.clamp(b.y, by, by + PL_BH);
      const dx = b.x - cx, dy = b.y - cy;
      if (dx * dx + dy * dy > b.r * b.r) continue;
      if (G.timers.fire > 0 && br.hp !== Infinity) {
        // raio quark: atravessa, mas quebra o bloco
        PL.damage(br, 'fire');
        continue;
      }
      const penX = Math.min(b.x + b.r - bx, bx + PL_BW - (b.x - b.r));
      const penY = Math.min(b.y + b.r - by, by + PL_BH - (b.y - b.r));
      if (penX < penY) b.vx = -b.vx; else b.vy = -b.vy;
      PL.damage(br, 'ball');
      hit = true;
      break;
    }
    if (hit) PL.speedUp(b);
  }
  // tiros da raquete
  for (let i = G.bullets.length - 1; i >= 0; i--) {
    const q = G.bullets[i];
    q.y -= 700 * dt;
    let gone = q.y < 0;
    for (const br of G.bricks) {
      if (br.dead || gone) continue;
      if (q.x >= br.x && q.x <= br.x + PL_BW && q.y >= br.y && q.y <= br.y + PL_BH) {
        PL.damage(br, 'laser'); gone = true;
      }
    }
    if (gone) G.bullets.splice(i, 1);
  }
  // quedas de poderes
  for (let i = G.drops.length - 1; i >= 0; i--) {
    const d = G.drops[i];
    d.y += 96 * dt; d.t += dt;   // queda clara: dá para ler o poder e ir pegar
    if (Math.abs(d.x - G.paddle.x) < w / 2 + 12 && d.y > (K.H - 44) - 14 && d.y < (K.H - 44) + 14) {
      PL.apply(d.id); G.drops.splice(i, 1); continue;
    }
    if (d.y > K.H + 20) G.drops.splice(i, 1);
  }
  // partículas e textos
  G.parts.forEach((p) => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.t -= dt; });
  G.parts = G.parts.filter((p) => p.t > 0);
  G.floats.forEach((f) => { f.y -= 40 * dt; f.t -= dt; });
  G.floats = G.floats.filter((f) => f.t > 0);
  if (G.msgT > 0) G.msgT -= dt;
  if (G.shake > 0) G.shake -= dt;
  // fim da bola / fim da fase
  if (G.balls.length === 0 && G.mode === 'play') {
    G.lives -= 1;
    AU.sfx('lose');
    if (G.lives <= 0) { G.mode = 'over'; G.modeT = 0; AU.stop(); }
    else { G.mode = 'ready'; G.msg = 'Vidas: ' + G.lives + ' · toque para soltar'; G.msgT = 2; PL.spawnBall(true); }
  }
  if (G.mode === 'play' && !G.bricks.some((b) => PL.breakable(b))) {
    G.mode = 'clear'; G.modeT = 0; AU.sfx('win'); AU.stop();
    PL.complete();
  }
};

// a bola acelera um pouco a cada pancada (limite no speed())
PL.speedUp = function (b) {
  const s = PL.speed();
  const m = Math.hypot(b.vx, b.vy) || 1;
  b.vx = b.vx / m * s; b.vy = b.vy / m * s;
  PL.guardAngle(b);
};
// ângulo mínimo: bola quase vertical quica para sempre; força um mínimo horizontal
PL.guardAngle = function (b) {
  const s = PL.speed();
  const min = s * 0.22;
  if (Math.abs(b.vx) >= min) return;
  const sign = b.vx < 0 ? -1 : 1;
  b.vx = sign * min;
  b.vy = (b.vy < 0 ? -1 : 1) * Math.sqrt(Math.max(0, s * s - min * min));
};

// salva progresso e libera a próxima fase
PL.complete = function () {
  const G = PL.G;
  const id = G.id;
  K.save.done[id] = true;
  const best = K.save.best[id] || 0;
  if (G.score > best) K.save.best[id] = G.score;
  const i = PL.order.indexOf(id);
  if (i >= 0 && i + 1 < PL.order.length) K.save.unlocked[PL.order[i + 1]] = true;
  K.store();
};
PL.next = function () {
  const i = PL.order.indexOf(PL.G.id);
  return i >= 0 && i + 1 < PL.order.length ? PL.order[i + 1] : null;
};

// ---- roda o tempo fixo ----
PL.update = function (dt) {
  const G = PL.G;
  if (!G) return;
  if (G.mode === 'clear' || G.mode === 'over') { G.modeT += dt; return; }
  if (G.paused) return;
  G.acc += dt;
  while (G.acc >= PL_STEP) {
    G.acc -= PL_STEP;
    if (G.mode === 'ready') {
      G.balls.forEach((b) => { if (b.stuck) b.x = G.paddle.x + b.ox; });
      G.t += PL_STEP;
      if (G.paddle) G.paddle.x = K.clamp(G.paddle.x, 60, 740);
      if (K.in.active) G.paddle.x = K.in.x;
      continue;
    }
    if (G.mode === 'play') PL.step(PL_STEP);
  }
};

PL.state = function () {
  const G = PL.G;
  if (!G) return null;
  return {
    id: G.id, mode: G.mode, score: G.score, lives: G.lives,
    bricksLeft: G.bricks.filter((b) => PL.breakable(b)).length,
    balls: G.balls.length, timers: G.timers,
  };
};

// ---- desenho ----
PL.drawSky = function (g, world) {
  const grd = g.createLinearGradient(0, 0, 0, K.H);
  grd.addColorStop(0, world.sky[0]);
  grd.addColorStop(1, world.sky[1]);
  g.fillStyle = grd;
  g.fillRect(0, 0, K.W, K.H);
  // estrelinhas nas colunas livres das laterais (regra 16); piscam nos gráficos médio e alto
  const n = [0, 16, 26][K.q];
  const t = performance.now() / 1000;
  for (let i = 0; i < n; i++) {
    const x = (i * 97 + 13) % K.W, y = (i * 53 + 7) % K.H;
    if (x > PL_X0 - 4 && x < K.W - PL_X0 + 4) continue;
    const tw = K.q ? 0.14 + 0.12 * Math.sin(t * 2 + i) : 0.18;
    g.fillStyle = 'rgba(255,255,255,' + tw + ')';
    g.fillRect(x, y, 2, 2);
  }
};

PL.draw = function (g) {
  const G = PL.G;
  if (!G) return;
  const sx = G.shake > 0 ? K.rnd(-4, 4) : 0, sy = G.shake > 0 ? K.rnd(-3, 3) : 0;
  PL.drawSky(g, G.world);
  g.save();
  g.translate(sx, sy);
  // bordas da área de jogo
  g.strokeStyle = 'rgba(255,255,255,0.25)';
  g.lineWidth = 2;
  g.strokeRect(2, 62, K.W - 4, K.H - 70);
  // blocos
  G.bricks.forEach((b) => {
    if (b.dead) return;
    b.def.draw(g, b.x, b.y, PL_BW, PL_BH, {
      hp: b.hp, maxHp: b.maxHp, world: G.world, t: G.t, flash: b.flash, letter: b.letter,
    });
  });
  // poderes caindo
  G.drops.forEach((d) => {
    const pw = K.powers[d.id];
    if (!pw) return;
    g.save();
    g.globalAlpha = 0.25; g.fillStyle = pw.color || '#fff';
    g.beginPath(); g.arc(d.x, d.y, 22, 0, Math.PI * 2); g.fill();
    g.restore();
    pw.draw(g, d.x, d.y, 14, G.t);
    // nome do poder embaixo do ícone, para o jogador saber o que está caindo
    K.txt(g, pw.name, d.x, d.y + 26, { font: 'bold 11px system-ui, Segoe UI, Arial', color: pw.good === false ? '#ffb3b3' : '#fff7d6' });
  });
  // raquete
  const w = G.paddle.w, px = G.paddle.x - w / 2, py = (K.H - 44) - PL_PH / 2;
  g.save();
  const pg = g.createLinearGradient(0, py, 0, py + PL_PH);
  pg.addColorStop(0, '#ffffff');
  pg.addColorStop(1, G.world.paddle);
  g.fillStyle = pg;
  g.beginPath(); g.roundRect(px, py, w, PL_PH, 7); g.fill();
  g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 2; g.stroke();
  if (G.timers.sticky > 0) { g.fillStyle = G.world.ball; g.fillRect(px + 6, py - 3, 6, 3); g.fillRect(px + w - 12, py - 3, 6, 3); }
  g.restore();
  // tiros da raquete
  g.fillStyle = '#ffe36b';
  G.bullets.forEach((q) => { g.beginPath(); g.roundRect(q.x - 2, q.y - 9, 4, 12, 2); g.fill(); });
  // bolas
  G.balls.forEach((b) => {
    // halo de brilho da bola (gradiente, sem shadowBlur); só nos gráficos médio e alto
    if (K.q >= 1) {
      const hg = g.createRadialGradient(b.x, b.y, b.r, b.x, b.y, b.r * 3.2);
      hg.addColorStop(0, 'rgba(255,255,255,0.35)');
      hg.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = hg;
      g.beginPath(); g.arc(b.x, b.y, b.r * 3.2, 0, Math.PI * 2); g.fill();
    }
    g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    g.fillStyle = G.timers.fire > 0 ? '#ff9a3c' : G.world.ball;
    g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.3)'; g.lineWidth = 1.5; g.stroke();
  });
  // escudo
  if (G.shield > 0) {
    g.save(); g.strokeStyle = 'rgba(120,255,220,0.8)'; g.lineWidth = 4;
    g.beginPath(); g.moveTo(0, K.H - 10); g.lineTo(K.W, K.H - 10); g.stroke(); g.restore();
  }
  // partículas e textos
  G.parts.forEach((p) => {
    g.globalAlpha = Math.max(0, p.t * 2);
    g.fillStyle = p.c; g.fillRect(p.x - 2, p.y - 2, 4, 4);
  });
  g.globalAlpha = 1;
  g.font = 'bold 16px system-ui, Segoe UI, Arial';
  g.textAlign = 'center';
  G.floats.forEach((f) => { g.globalAlpha = Math.min(1, f.t * 2); g.fillStyle = '#fff3b0'; g.fillText(f.txt, f.x, f.y); });
  g.globalAlpha = 1;
  g.restore();
  PL.drawHud(g);
  // mensagens e estado "pronto"
  if (G.msgT > 0) PL.banner(g, G.msg, 0.4);
  if (G.mode === 'ready') PL.banner(g, 'Toque ou aperte espaço para soltar a bola', 0.82);
};

PL.banner = function (g, txt, yFrac) {
  g.save();
  g.font = 'bold 18px system-ui, Segoe UI, Arial';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const w = g.measureText(txt).width + 36;
  g.fillStyle = 'rgba(10,10,30,0.7)';
  g.beginPath(); g.roundRect(K.W / 2 - w / 2, K.H * yFrac - 18, w, 36, 18); g.fill();
  g.fillStyle = '#ffffff';
  g.fillText(txt, K.W / 2, K.H * yFrac);
  g.restore();
};

PL.drawHud = function (g) {
  const G = PL.G;
  g.save();
  g.fillStyle = 'rgba(0,0,0,0.25)';
  g.fillRect(0, 0, K.W, 56);
  g.fillStyle = '#ffffff';
  g.font = 'bold 18px system-ui, Segoe UI, Arial';
  g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText(G.def.name, 16, 20);
  g.textAlign = 'center';
  g.fillText('Pontos ' + K.fmt(G.score), K.W / 2, 28);
  g.textAlign = 'right';
  g.fillText('♥ ' + G.lives, K.W - 80, 28);
  // botão de pausa (toque)
  // botão de pausa só existe durante a jogada (nas sobreposições ele atrapalharia o foco do teclado)
  if (G.mode === 'play' || G.mode === 'ready') K.btn(g, K.W - 48, 12, 36, 32, 'II', () => PL.pause(), { size: 16, top: '#fff', bot: '#d9dde8' });
  // poderes ativos: barras
  let x = 16;
  const bars = [['laser', 'Lança'], ['fire', 'Raio'], ['sticky', 'Ímã'], ['wide', 'Expansão'], ['narrow', 'Pacote'], ['slow', 'Mel'], ['bonus', 'Bônus']];
  bars.forEach(([k, label]) => {
    const t = G.timers[k];
    if (!(t > 0)) return;
    g.fillStyle = 'rgba(255,255,255,0.2)'; g.fillRect(x, 46, 80, 6);
    g.fillStyle = (K.powers[k] && K.powers[k].color) || '#fff';

    g.textAlign = 'left'; g.fillText(label, x, 39);
    x += 92;
  });
  if (G.shield > 0) { g.fillStyle = '#7fffd4'; g.font = 'bold 11px system-ui'; g.fillText('Escudo x' + G.shield, x, 36); }
  g.restore();
};

PL.press = function (x, y) {
  const G = PL.G;
  if (!G || G.paused || G.mode === 'over' || G.mode === 'clear' || G.mode === 'pause') return;
  // qualquer bola grudada (ímã ou começo da fase) solta no toque
  if (G.balls.some((b) => b.stuck)) PL.launch();
  if (G.mode === 'play' && y < 60 && x > K.W - 100) PL.pause();
};
PL.pause = function () {
  const G = PL.G;
  if (!G || G.mode !== 'play') return;
  G.mode = 'pause'; G.paused = true;

};
PL.resume = function () {
  const G = PL.G;

/*==ENGINE:ui==  JGK · cenas de menu (título, fases, história, opções, créditos) e cena de jogo com sobreposições */
const UI_CX = 400;                       // coluna central dos botões
const UI_BW = 280, UI_BH = 58;           // tamanho padrão de botão
function ui_t() { return performance.now() / 1000; }
function ui_bg(g, world, cols) {
  // fundo escuro com brilho pulsando + blocos reais só nas colunas laterais livres (regra 16)
  const t = ui_t();
  const grd = g.createLinearGradient(0, 0, 0, K.H);
  grd.addColorStop(0, '#0d0a24'); grd.addColorStop(1, world.sky[1]);
  g.fillStyle = grd; g.fillRect(0, 0, K.W, K.H);
  const glow = g.createRadialGradient(K.W / 2, 90, 20, K.W / 2, 90, 420);
  glow.addColorStop(0, 'rgba(255,210,63,' + (0.16 + Math.sin(t * 2) * 0.05) + ')');
  glow.addColorStop(1, 'rgba(255,210,63,0)');
  g.fillStyle = glow; g.fillRect(0, 0, K.W, K.H);
  const kinds = ['basico', 'dupla', 'tripla', 'explosivo', 'basico', 'marca'];
  const n = cols || 1;
  g.save(); g.globalAlpha = 0.5;
  for (let side = 0; side < 2; side++) {
    for (let c = 0; c < n; c++) {
      const x = side ? K.W - 57 - c * 47 : 16 + c * 47;
      const dir = (side + c) % 2 ? -1 : 1;
      const hn = K.H + 16;
      for (let i = 0; i < Math.ceil(hn / 28); i++) {
        if ((i * 7 + c * 3 + side) % 3 === 0) continue;
        const y = (((i * 28 + dir * t * (12 + c * 5)) % hn) + hn) % hn - 28;
        const bd = K.blocks[kinds[(i + c * 2 + side) % kinds.length]];
        if (bd) bd.draw(g, x, y, 41, 21, { hp: 1, maxHp: 1, world, t, flash: 0, letter: null });
      }
    }
  }
  g.restore();
}
function ui_title(g, text, y) {
  const t = ui_t();
  g.save();
  g.font = 'bold 44px system-ui, Segoe UI, Arial';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.shadowColor = 'rgba(255,210,63,' + (0.45 + Math.sin(t * 2) * 0.15) + ')'; g.shadowBlur = 18;
  g.lineWidth = 8; g.strokeStyle = 'rgba(40,10,60,0.92)';
  g.strokeText(text, K.W / 2, y); g.fillStyle = '#ffe36b'; g.fillText(text, K.W / 2, y);
  g.restore();
}
function ui_small(g, text, x, y, align) {
  K.txt(g, text, x, y, { font: '14px system-ui, Segoe UI, Arial', align: align || 'center', color: '#f2eefc' });
}
// painel de vidro escuro com borda neon suave e reflexo
function ui_panel(g, x, y, w, h, accent) {
  g.save();
  const gr = g.createLinearGradient(0, y, 0, y + h);
  gr.addColorStop(0, 'rgba(40,26,80,0.88)'); gr.addColorStop(1, 'rgba(12,8,30,0.9)');
  g.fillStyle = gr; g.beginPath(); g.roundRect(x, y, w, h, 18); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.06)';
  g.beginPath(); g.roundRect(x + 4, y + 3, w - 8, Math.min(h * 0.3, 40), 14); g.fill();
  g.strokeStyle = accent || 'rgba(255,210,63,0.45)'; g.lineWidth = 1.5;
  g.beginPath(); g.roundRect(x, y, w, h, 18); g.stroke();
  g.restore();
}
// botão de vidro (mesmo estilo do menu principal); opt: {accent, size, primary, dim, edge}
function ui_btn(g, x, y, w, h, label, fn, opt) {
  opt = opt || {};
  const idx = K.buttons.length;
  const hover = K.in.active && K.in.x >= x && K.in.x <= x + w && K.in.y >= y && K.in.y <= y + h;
  if (hover && !K.in.down) K.focus = idx;
  const on = K.focus === idx || hover;
  K.buttons.push({ x, y, w, h, fn });
  const t = ui_t();
  const accent = opt.accent || (opt.primary ? '#ffd23f' : K.worlds.w1.accent);
  const pulse = on ? 1 + Math.sin(t * 6) * 0.02 : 1;
  const r = Math.min(14, h / 3);
  g.save();
  g.translate(x + w / 2, y + h / 2); g.scale(pulse, pulse); g.translate(-(x + w / 2), -(y + h / 2));
  if (on) {
    g.globalAlpha = 0.35 + Math.sin(t * 6) * 0.15;
    g.strokeStyle = accent; g.lineWidth = 8;
    g.beginPath(); g.roundRect(x - 4, y - 4, w + 8, h + 8, r + 2); g.stroke();
    g.globalAlpha = 1;
  }
  const grd = g.createLinearGradient(0, y, 0, y + h);
  grd.addColorStop(0, opt.dim ? 'rgba(50,48,70,0.92)' : 'rgba(60,40,100,0.92)');
  grd.addColorStop(1, opt.dim ? 'rgba(24,22,36,0.92)' : 'rgba(18,10,40,0.92)');
  g.fillStyle = grd; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.10)';
  g.beginPath(); g.roundRect(x + 4, y + 3, w - 8, h * 0.42, Math.max(4, r - 4)); g.fill();
  g.strokeStyle = on ? accent : (opt.edge || 'rgba(255,255,255,0.35)'); g.lineWidth = on ? 3 : 1.5;
  g.beginPath(); g.roundRect(x, y, w, h, r); g.stroke();
  g.restore();
  K.txt(g, label, x + w / 2, y + h / 2 + 1, {
    font: 'bold ' + (opt.size || 22) + 'px system-ui, Segoe UI, Arial', halo: 4,
    color: opt.dim ? '#c9c5d8' : (opt.primary || on ? accent : '#ffffff'),
  });
}

// quebra de linha simples para texto em canvas
function PL_wrap(g, text, x, y, maxW, lh) {
  const words = (text || '').split(' ');
  let line = '', yy = y;
  words.forEach((w) => {
    const test = line ? line + ' ' + w : w;
    if (g.measureText(test).width > maxW && line) { g.fillText(line, x, yy); line = w; yy += lh; }
    else line = test;
  });
  if (line) g.fillText(line, x, yy);
}

K.defScene('credits', {

    this.y -= 40 * fast * dt;
    if (this.y < -this.total()) this.y = K.wide() ? 360 : 420;
  },
  // escala tipográfica dos créditos: cada tipo tem tamanho, peso, cor e espaço próprios
  gap(kind) { return { head: 58, label: 36, small: 30, thanks: 60 }[kind]; },
  total() { return this.lines().reduce((a, l) => a + this.gap(l.kind), 0) + 120; },
  lines() {
    // créditos padrão (regra 19): dono, time, motor. Depois só o agradecimento final.
    const L = (t, kind) => ({ t, kind });
    const list = [
      L('Desenvolvido e Dirigido por: Pedro Javarotti', 'head'),
      L('Feito por um time de IA · gerente Haiku 5.5 (esforço médio)', 'label'),
      L('4 agentes Haiku 5.5 (esforço baixo)', 'label'),
      L('fases, blocos, poderes, músicas e histórias', 'small'),
      L('Motor JGK · Javarotti Game Kit', 'label'),
    ];
    (K.credits.extra || []).forEach((t) => list.push(L(t, 'thanks')));
    list.push(L('Versão ' + K.version, 'small'));

  },
  draw(g) {

    const color = { head: '#ffe36b', label: '#ffffff', small: '#c9c3e6', thanks: '#fff2c4' };
    let y = this.y + (wd ? -16 : 0);
    this.lines().forEach((l) => {
      K.txt(g, l.t, K.W / 2, y, { font: font[l.kind], color: color[l.kind] });
      y += this.gap(l.kind);
    });
    // esmaece o texto nas bordas do painel
    const fade = g.createLinearGradient(0, py, 0, py + ph);
    fade.addColorStop(0, 'rgba(12,8,30,0.95)'); fade.addColorStop(0.08, 'rgba(12,8,30,0)');
    fade.addColorStop(0.92, 'rgba(12,8,30,0)'); fade.addColorStop(1, 'rgba(12,8,30,0.95)');
    g.fillStyle = fade; g.fillRect(px, py, 600, ph);
    g.restore();
    ui_small(g, 'Segure na tela (ou espaço) para acelerar', K.W / 2, wd ? 412 : 497);
    K.fsIcon(g);
    ui_btn(g, K.W / 2 - UI_BW / 2, wd ? 430 : 515, UI_BW, wd ? 44 : 50, 'Voltar', () => K.go('title'), { size: 18 });
  },
  key(k) { if (k === 'Escape' || k === 'Enter') K.go('title'); },
});

K.defScene('play', {
  wide: true,

  },
  leave() { AU.stop(); },
  update(dt) {
    PL.update(dt);
    const G = PL.G;
    if (G && G.mode === 'clear' && G.modeT > 0.8 && !this.clearShown) this.clearShown = true;
  },
  draw(g) {
    const G = PL.G;
    if (!G) return;
    PL.draw(g);
    if (G.mode === 'pause') {
      g.save(); g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(0, 0, K.W, K.H); g.restore();
      K.panel(g, K.W / 2 - 160, 170, 320, 100);
      ui_title(g, 'Pausado', 220);
      ui_btn(g, K.W / 2 - UI_BW / 2, 280, UI_BW, UI_BH, 'Continuar', () => PL.resume(), { primary: true });
      ui_btn(g, K.W / 2 - UI_BW / 2, 352, UI_BW, UI_BH, 'Repetir fase', () => K.go('play', this.id));
      ui_btn(g, K.W / 2 - UI_BW / 2, 424, UI_BW, UI_BH, 'Menu', () => K.go('select'));
    }
    if (G.mode === 'clear') {
      g.save(); g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(0, 0, K.W, K.H); g.restore();
      K.panel(g, K.W / 2 - 160, 150, 320, 130);
      ui_title(g, 'Fase limpa!', 200);
      ui_small(g, 'Pontos: ' + K.fmt(G.score) + ' · Recorde: ' + K.fmt(K.save.best[this.id] || 0), K.W / 2, 260);
      const nx = PL.next();
      if (nx) ui_btn(g, K.W / 2 - UI_BW / 2, 300, UI_BW, UI_BH, 'Próxima fase', () => ui_enter(nx), { primary: true });
      ui_btn(g, K.W / 2 - UI_BW / 2, nx ? 372 : 300, UI_BW, UI_BH, 'Repetir', () => K.go('play', this.id));
      ui_btn(g, K.W / 2 - UI_BW / 2, nx ? 444 : 372, UI_BW, UI_BH, 'Menu', () => K.go('select'));
    }
    if (G.mode === 'over') {
      g.save(); g.fillStyle = 'rgba(0,0,0,0.65)'; g.fillRect(0, 0, K.W, K.H); g.restore();
      K.panel(g, K.W / 2 - 160, 150, 320, 130);
      ui_title(g, 'Fim de jogo', 220);
      ui_small(g, 'Pontos: ' + K.fmt(G.score), K.W / 2, 260);
      ui_btn(g, K.W / 2 - UI_BW / 2, 300, UI_BW, UI_BH, 'Tentar de novo', () => K.go('play', this.id), { primary: true });
      ui_btn(g, K.W / 2 - UI_BW / 2, 372, UI_BW, UI_BH, 'Menu', () => K.go('select'));
    }
  },
  // clique/toque na tela de jogo: solta a bola grudada (o motor chama press ao descer o ponteiro)
  press(x, y) { PL.press(x, y); },
  // na fase, as setas e o espaço são da raquete; Backspace pausa (ou volta do pausado)
  free() { const G = PL.G; return !!G && (G.mode === 'play' || G.mode === 'ready'); },
  back() { const G = PL.G; if (!G) { K.go('select'); return; } if (G.mode === 'play') PL.pause(); else if (G.mode === 'pause') PL.resume(); else K.go('select'); },
  tap() {},
  key(k) {
    const G = PL.G;
    if (!G) return;
    if (k === ' ' && G.balls.some((b) => b.stuck)) PL.launch();
    if ((k === 'Escape' || k === 'p' || k === 'P') && G.mode === 'play') PL.pause();
    else if ((k === 'Escape' || k === 'p' || k === 'P') && G.mode === 'pause') PL.resume();
    if (k === 'Escape' && (G.mode === 'clear' || G.mode === 'over')) K.go('select');
  },
  blur() { PL.pause(); },
});

/*==ENGINE:title==  JGK · menu principal: demonstração animada com os blocos reais, título ondulante e botões de vidro */
const TT = (K.titleFx = {});
TT.init = function () {
  TT.t = 0;
  TT.bricks = [];
  // parede de blocos reais, só na faixa de cima: os botões ficam embaixo (regra 16)
  const kinds = ['basico', 'dupla', 'tripla', 'explosivo', 'basico', 'marca'];
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 16; c++) {
      if ((r * 7 + c * 3) % 9 === 0) continue;
      const id = kinds[(r * 5 + c) % kinds.length];
      TT.bricks.push({ x: 26 + c * 47, y: 34 + r * 27, w: 41, h: 21, id, alive: true, flash: 0 });
    }
  }
  TT.ball = { x: 300, y: 200, vx: 230, vy: -300, r: 7 };
  TT.parts = [];
};
if (!TT.bricks) TT.init();

TT.hitBrick = function (b) {
  b.alive = false;
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2, s = K.rnd(40, 180);
    TT.parts.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: K.rnd(0.3, 0.7), c: b.id === 'marca' ? '#ffd23f' : '#7cc24a' });
  }
};

TT.update = function (dt) {
  TT.t += dt;
  const ball = TT.ball;
  ball.x += ball.vx * dt; ball.y += ball.vy * dt;
  if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
  if (ball.x > 800 - ball.r) { ball.x = 800 - ball.r; ball.vx = -Math.abs(ball.vx); }
  if (ball.y < 14 + ball.r) { ball.y = 14 + ball.r; ball.vy = Math.abs(ball.vy); }
  if (ball.y > 160) { ball.y = 160; ball.vy = -Math.abs(ball.vy); }
  for (const b of TT.bricks) {
    if (!b.alive) continue;
    const cx = K.clamp(ball.x, b.x, b.x + b.w), cy = K.clamp(ball.y, b.y, b.y + b.h);
    const dx = ball.x - cx, dy = ball.y - cy;
    if (dx * dx + dy * dy > ball.r * ball.r) continue;
    const penX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
    const penY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
    if (penX < penY) ball.vx = -ball.vx; else ball.vy = -ball.vy;
    TT.hitBrick(b);
    AU.sfx('break');
    break;
  }
  if (TT.bricks.every((b) => !b.alive)) TT.init();
  TT.parts.forEach((p) => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; p.t -= dt; });
  TT.parts = TT.parts.filter((p) => p.t > 0);
};

// botão de vidro com foco pulsante (desenhado do zero, sem o estilo "pintado")
TT.button = function (g, idx, label, x, y, w, h, fn, primary) {
  const focused = K.focus === idx;
  const hover = K.in.active && K.in.x >= x && K.in.x <= x + w && K.in.y >= y && K.in.y <= y + h;
  if (hover && !K.in.down) K.focus = idx;
  const on = focused || hover;
  const pulse = on ? 1 + Math.sin(TT.t * 6) * 0.02 : 1;
  K.buttons.push({ x, y, w, h, fn });
  const accent = primary ? '#ffd23f' : K.worlds.w1.accent;
  g.save();
  g.translate(x + w / 2, y + h / 2);
  g.scale(pulse, pulse);
  g.translate(-(x + w / 2), -(y + h / 2));
  // brilho externo (anel) quando focado
  if (on) {
    g.globalAlpha = 0.35 + Math.sin(TT.t * 6) * 0.15;
    g.strokeStyle = accent; g.lineWidth = 8;
    g.beginPath(); g.roundRect(x - 4, y - 4, w + 8, h + 8, 16); g.stroke();
    g.globalAlpha = 1;
  }
  // corpo de vidro escuro com reflexo
  const grd = g.createLinearGradient(0, y, 0, y + h);
  grd.addColorStop(0, 'rgba(60,40,100,0.92)');
  grd.addColorStop(1, 'rgba(18,10,40,0.92)');
  g.fillStyle = grd;
  g.beginPath(); g.roundRect(x, y, w, h, 14); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.10)';
  g.beginPath(); g.roundRect(x + 4, y + 3, w - 8, h * 0.42, 10); g.fill();
  // borda neon
  g.strokeStyle = on ? accent : 'rgba(255,255,255,0.35)';
  g.lineWidth = on ? 3 : 1.5;
  g.beginPath(); g.roundRect(x, y, w, h, 14); g.stroke();
  // texto com contorno luminoso
  g.font = 'bold 24px system-ui, Segoe UI, Arial';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = 4; g.strokeStyle = 'rgba(0,0,0,0.5)';
  g.strokeText(label, x + w / 2, y + h / 2 + 1);
  g.fillStyle = primary || on ? accent : '#ffffff';
  g.fillText(label, x + w / 2, y + h / 2 + 1);
  g.restore();
};

  // ---------- HELPERS (locais à IIFE) ----------
  function rr(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  // Corpo de vidro: cor sólida + gradiente claro no topo + borda escura de 1 px.
  function glass(g, x, y, w, h, col) {
    rr(g, x + 0.5, y + 0.5, w - 1, h - 1, 4);
    g.fillStyle = col;
    g.fill();
    const gr = g.createLinearGradient(0, y, 0, y + h);
    gr.addColorStop(0, 'rgba(255,255,255,0.75)');
    gr.addColorStop(0.45, 'rgba(255,255,255,0.12)');

    gr.addColorStop(1, 'rgba(0,0,0,0.28)');
    rr(g, x + 0.5, y + 0.5, w - 1, h - 1, 4);
    g.fillStyle = gr;
    g.fill();
    rr(g, x + 0.5, y + 0.5, w - 1, h - 1, 4);
    g.lineWidth = 1;
    g.strokeStyle = 'rgba(0,0,0,0.55)';
    g.stroke();

  // Cor com alpha pela fração de vida restante (blocos que apagam conforme apanham).
  function lifeAlpha(st) {
    const f = st.maxHp > 0 ? Math.max(0, st.hp) / st.maxHp : 1;

      g.beginPath();

  var TAU = Math.PI * 2;

  // Medalhão: fundo escuro (contraste em qualquer mundo), anel colorido com volume, borda clara e reflexo.
  function badge(g, x, y, r, c) {

      g.strokeStyle = '#9a6700';
      g.stroke();
      if (rx > 4.5 * s) {
        // estrela de 5 pontas no miolo
        g.beginPath();
        for (var i = 0; i < 10; i++) {
          var a = -Math.PI / 2 + i * Math.PI / 5, rr = (i % 2 ? 1.9 : 4.2) * s;
          var px = x + Math.cos(a) * rr * (rx / (8.5 * s)), py = y + Math.sin(a) * rr;
          if (i) g.lineTo(px, py); else g.moveTo(px, py);
        }
        g.closePath();
        g.fillStyle = '#fff7c2';
        g.fill();
        g.lineWidth = 0.9 * s;
        g.strokeStyle = '#9a6700';
        g.stroke();
      }
      g.restore();
    }
  });

  K.defPower('vida', {
    name: 'Coração Pixel',
    desc: 'Ganha uma vida extra',
    color: '#ff4d6d',
    good: true,
    draw: function (g, x, y, r, t) {
      t = t || 0;
      var s = r / 16;
      var rows = ['0110110', '1111111', '1111111', '0111110', '0011100', '0001000'];
      var k = 1 + 0.07 * Math.sin(t * 6);
      var ps = 2.6 * s * k;
      var ox = x - (7 * ps) / 2, oy = y - (6 * ps) / 2;
      var i, j;
      g.save();
      badge(g, x, y, r, '#ff4d6d');
      // contorno escuro: cada pixel preenchido expandido em 1 px
      g.fillStyle = INK;
      for (j = 0; j < rows.length; j++) {
        for (i = 0; i < 7; i++) {
          if (rows[j].charAt(i) !== '1') continue;
          g.beginPath();
          g.rect(ox + i * ps - 1.2, oy + j * ps - 1.2, ps + 2.4, ps + 2.4);
          g.fill();
        }
      }
      // corpo vermelho com degradê, depois brilho nos pixels de cima à esquerda
      var hg = g.createLinearGradient(x, oy, x, oy + 6 * ps);
      hg.addColorStop(0, '#ff8fa3');
      hg.addColorStop(1, '#d90429');
      g.fillStyle = hg;
      for (j = 0; j < rows.length; j++) {
        for (i = 0; i < 7; i++) {
          if (rows[j].charAt(i) !== '1') continue;
          g.beginPath();
          g.rect(ox + i * ps, oy + j * ps, ps + 0.4, ps + 0.4);
          g.fill();
        }
      }
      g.fillStyle = '#ffffff';
      g.beginPath();
      g.rect(ox + 1 * ps, oy + 0.9 * ps, ps * 0.9, ps * 0.9);
      g.rect(ox + 1 * ps, oy + 1.9 * ps, ps * 0.45, ps * 0.9);
      g.fill();
      g.restore();
    }
  });
})();

// Bloco de marca: peça do mosaico que desenha JAVAROTTI / JGK na tela. Dourado com brilho que anda.
K.defBlock('marca', {
  name: 'Peça da marca',
  hp: 1,
  score: 30,
  draw(g, x, y, w, h, st) {
    g.save();
    const rad = Math.min(4, h / 3);
    const body = () => { g.beginPath(); g.roundRect(x, y, w, h, rad); };
    // corpo: degradê de ouro com bandas (reflexo metálico)
    const grd = g.createLinearGradient(x, y, x, y + h);
    grd.addColorStop(0, '#fff6b8');
    grd.addColorStop(0.35, '#ffd24a');
    grd.addColorStop(0.55, '#f0a81c');
    grd.addColorStop(1, '#a8650c');
    g.fillStyle = grd;
    body(); g.fill();
    g.save();
    body(); g.clip();
    // brilho de canto superior esquerdo (radial, sem shadowBlur)
    const rg = g.createRadialGradient(x + w * 0.2, y + h * 0.15, 1, x + w * 0.2, y + h * 0.15, Math.max(w, h) * 0.7);
    rg.addColorStop(0, 'rgba(255,255,255,0.55)');
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = rg;
    g.fillRect(x, y, w, h);
    // faixa escura embaixo para dar volume
    g.fillStyle = 'rgba(110,55,0,0.35)';
    g.fillRect(x, y + h * 0.78, w, h * 0.22);
    // faixa de luz diagonal que passa a cada 2,4 s
    const sweep = ((st.t || 0) % 2.4) / 2.4;
    const sx = x - w + sweep * (w * 3);
    g.globalAlpha = 0.6;
    g.fillStyle = '#ffffff';
    g.beginPath(); g.moveTo(sx, y + h); g.lineTo(sx + 7, y + h); g.lineTo(sx + 19, y); g.lineTo(sx + 12, y); g.closePath(); g.fill();
    g.globalAlpha = 0.25;
    g.beginPath(); g.moveTo(sx + 9, y + h); g.lineTo(sx + 12, y + h); g.lineTo(sx + 24, y); g.lineTo(sx + 21, y); g.closePath(); g.fill();
    g.restore();
    // reflexo fino de cima
    g.fillStyle = 'rgba(255,255,255,0.7)';
    g.fillRect(x + rad, y + 1.5, w - rad * 2, 1.5);
    // contorno interno claro e externo escuro
    g.lineWidth = 1;
    g.strokeStyle = 'rgba(255,250,200,0.8)';
    g.beginPath(); g.roundRect(x + 1.5, y + 1.5, w - 3, h - 3, Math.max(1, rad - 1)); g.stroke();
    g.lineWidth = 1.5; g.strokeStyle = '#5a3206';
    body(); g.stroke();
    if (st.flash > 0) { g.globalAlpha = st.flash * 0.7; g.fillStyle = '#ffffff'; body(); g.fill(); }
    g.restore();
  },
});
