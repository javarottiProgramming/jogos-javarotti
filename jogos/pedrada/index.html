<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Pedrada de Palito 1.2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
html,body{height:100%;margin:0;background:#14142B;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#wrap{position:fixed;left:50%;top:50%;overflow:hidden;background:#14142B;touch-action:none}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;image-rendering:auto;cursor:crosshair}
#safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#load{position:fixed;inset:0;display:grid;place-items:center;font:28px 'Permanent Marker','Comic Sans MS',cursive;color:#FFD93D;background:#14142B;z-index:9}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="safe"></div>
<div id="load">Apontando o estilingue…</div>
<script>
/*==ENGINE:core==  núcleo: utilitários, canvas, loop de passo fixo, cenas, transições, save. (motor JGK-FPS — Javarotti Game Kit, módulos de gênero em primeira pessoa) */
'use strict';
const K = window.K = { id: 'pedrada' /* 1.2.0: identidade do jogo (sala online, save) */, version: '1.2.0', /* suba a cada rodada de correções: título, créditos e <title> leem daqui */ debug: window.__KDBG || {} };
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2, VH = 540, DT = 1 / 120;
let VW = 960, PR = 1;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const R = (a, b) => a + Math.random() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = a => a[Math.random() * a.length | 0];
const sign = v => v > 0 ? 1 : v < 0 ? -1 : 0;
const appr = (v, t, s) => v < t ? Math.min(v + s, t) : Math.max(v - s, t);
const damp = (a, b, l, dt) => a + (b - a) * (1 - Math.exp(-l * dt));
const chance = (p, dt) => Math.random() < p * dt;          // p = eventos por segundo
function rng(seed) { let s = seed >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const E = {                                                 // curvas de easing (t em 0..1)
  lin: t => t, in2: t => t * t, out2: t => 1 - (1 - t) * (1 - t), io2: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  out3: t => 1 - Math.pow(1 - t, 3), in3: t => t * t * t,
  outBack: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * TAU / 3) + 1
};
Object.assign(K, { clamp, lerp, R, RI, pick, sign, appr, damp, chance, rng, E, TAU, VH, DT });

/* ------------------------------------------------------------------ paleta de UI (papel + tinta + marcadores; NUNCA marrom/sépia) */
const PAL = K.pal = { ink: '#14142B', ink2: '#2A2A55', paper: '#F7F5EE', paper2: '#E6EAF5', grid: '#BFD3F2', blue: '#2D6CDF', blue2: '#1B4AA8', red: '#E5383B', red2: '#A3151A', yellow: '#FFD93D', yellow2: '#C99A00', green: '#2FB36A', chalk: '#EDEFE6' };

/* ------------------------------------------------------------------ save */
const SAVE_KEY = 'pedrada.v1.save';
/* done['1'] = {st:1..3 estrelas, kills, t, hp}  ·  opt: sv/mv volumes 0-100, sens 1..10, inv (inverter Y), assist (mira assistida), q/qa qualidade, bsz/balpha toque, shake 0/1, hap */
const SAVE = K.save = { done: {}, seen: {}, arms: {} /* 1.1.0: armas já pegas no cenário (id → 1) */, intro: 0, end: 0, opt: { sv: 100, mv: 70, sens: 5, inv: 0, assist: 1, q: 1, qa: 1, bsz: 1, balpha: .55, shake: 1, hap: 1, fov: 1 } };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s) Object.assign(SAVE, s, { opt: Object.assign(SAVE.opt, s.opt || {}) }); } catch (e) {}
SAVE.opt.snd = SAVE.opt.sv > 0 ? 1 : 0; SAVE.opt.mus = SAVE.opt.mv > 0 ? 1 : 0;
/* qualidade: qa=1 → automático (só reduz em memória, nunca grava); qa=0 → escolha manual do jogador, respeitada sempre (regra 13) */
K.qRun = 1; const QEFF = K.qEff = () => SAVE.opt.qa ? Math.min(K.qRun, 2) : SAVE.opt.q;
K.qLabel = () => 'Gráficos: ' + (SAVE.opt.qa ? 'automático' : ['leves', 'médios', 'altos'][SAVE.opt.q]);
K.qCycle = () => { const o = SAVE.opt; if (o.qa) { o.qa = 0; o.q = 0; } else if (o.q < 2) o.q++; else { o.qa = 1; K.qRun = 1; } if (typeof resize === 'function') resize(); K.persist(); };
K.persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {} };
K.resetSave = () => { SAVE.done = {}; SAVE.seen = {}; SAVE.arms = {}; SAVE.intro = 0; SAVE.end = 0; K.persist(); };
/* 1.2.0 (lição 37 do JGK): migração ÚNICA e versionada das opções. `Object.assign(padrões, salvo)` só acrescenta chave nova;
 * quando um padrão EXISTENTE mudar, suba OPT_V e escreva a migração em OPT_MIGR[v] (roda uma vez em quem tem save antigo; depois a escolha manual volta a ser sagrada, regra h).
 * K.optMigrate(opt, migr, alvo, temSave) é pura (o teste usa migrações falsas). Devolve true se mexeu. */
const OPT_V = 1, OPT_MIGR = { 1: () => {} /* 1.2.0: só marca o save; nenhum padrão mudou */ };
K.optMigrate = (o, M, V, had) => { const v0 = o.optV || 0; if (v0 >= V) return false; if (had) for (let v = v0 + 1; v <= V; v++) if (M[v]) M[v](o); o.optV = V; return true; };
{ let had = false; try { had = !!localStorage.getItem(SAVE_KEY); } catch (e) {} if (K.optMigrate(SAVE.opt, OPT_MIGR, OPT_V, had)) K.persist(); }

/* ------------------------------------------------------------------ canvas / viewport */
const cv = $('cv'), ctx = cv.getContext('2d', { alpha: false }), wrap = $('wrap');
const VIEW = K.view = { rot: false, sc: 1, safeL: 0, safeR: 0, safeT: 0, safeB: 0, touch: false };
function readSafe() {
  const p = $('safe'); if (!p) return; const cs = getComputedStyle(p), f = k => (parseFloat(cs[k]) || 0) / VIEW.sc;
  const l = f('paddingLeft'), r = f('paddingRight'), t = f('paddingTop'), b = f('paddingBottom');
  if (VIEW.rot) { VIEW.safeL = t; VIEW.safeR = b; VIEW.safeT = r; VIEW.safeB = l; } else { VIEW.safeL = l; VIEW.safeR = r; VIEW.safeT = t; VIEW.safeB = b; }
}
function resize() {
  const iw = window.innerWidth || 960, ih = window.innerHeight || 540, rot = ih > iw * 1.02;
  const W = rot ? ih : iw, H = rot ? iw : ih;
  VIEW.rot = rot; wrap.style.width = W + 'px'; wrap.style.height = H + 'px';
  wrap.style.transform = 'translate(-50%,-50%)' + (rot ? ' rotate(90deg)' : '');
  VW = clamp(Math.round(VH * W / H), 720, 1300);
  const sc = Math.min(W / VW, H / VH); VIEW.sc = sc;
  cv.style.width = Math.round(VW * sc) + 'px'; cv.style.height = Math.round(VH * sc) + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 3), cap = [1, 1.5, 2][QEFF()] || 1.5;
  PR = clamp(sc * dpr, .6, cap); if (K.debug.pr) PR = K.debug.pr;
  cv.width = Math.round(VW * PR); cv.height = Math.round(VH * PR);
  K.VW = VW; K.PR = PR; readSafe();
  if (K.r3 && K.r3.resize) K.r3.resize();
  if (K.scene && K.scene.resize) K.scene.resize();
}
window.addEventListener('resize', resize); window.addEventListener('orientationchange', () => setTimeout(resize, 120));
/* 1.2.0 (lições 47 + 75 do JGK): voltar de segundo plano nunca mostra tela quebrada, e nunca joga fora o que o jogador estava fazendo.
 * - Tempo fora NÃO recarrega (lição 75: recarregar depois de 8 s no WhatsApp jogaria fora a fase ou derrubaria a sala). Voltar de >= K.bg.min ms só REFAZ
 *   (K.refresh: caches de K.blit, quadros altos dos bots, tamanho). Os dados das texturas/sprites vivem em Uint32Array e não se perdem.
 * - Recarrega só quando a tela foi perdida DE FATO e se puder (K.canReload: fora de fase e sem sala online): `pageshow` vindo do cache do navegador, ou
 *   `contextlost` que não volta em 3 s. Trava contra laço: no máximo uma recarga a cada 15 s. `contextrestored` só refaz.
 * - Layout escuta ResizeObserver (janela que nasce com tamanho 0 dentro de iframe). */
K.bg = { at: 0, min: 8000, refreshes: 0 };
K.refresh = why => {
  K.bg.refreshes++;
  const drop = o => { if (o) for (const k in o) { const f = o[k]; if (f) f._cn = null; } };
  drop(K.sprites); drop(K.tex);
  if (K.looks) for (const id in K.looks) for (const an in K.looks[id].frames) for (const f of K.looks[id].frames[an]) f._cn = null;
  if (K.dropHi) K.dropHi(); resize();
};
K.canReload = () => K.sceneName !== 'play' && !(K.net && K.net.active);
K.reload = why => { try { const last = +sessionStorage.getItem('jgk.reloadT') || 0; if (Date.now() - last < 15000) { K.refresh('trava: ' + why); return false; } sessionStorage.setItem('jgk.reloadT', String(Date.now())); } catch (e) {} try { console.warn('[JGK] recarregando: ' + why); location.reload(); } catch (e) {} return true; };
const bgHide = () => { if (!K.bg.at) K.bg.at = Date.now(); };
const bgShow = () => { const at = K.bg.at; K.bg.at = 0; if (!at) return; if (Date.now() - at >= K.bg.min) K.refresh('segundo plano'); else resize(); };
document.addEventListener('visibilitychange', () => { if (document.hidden) bgHide(); else bgShow(); });
window.addEventListener('pagehide', bgHide);
window.addEventListener('pageshow', e => { if (e.persisted && K.canReload()) K.reload('pageshow do cache'); else if (e.persisted) K.refresh('pageshow do cache'); else bgShow(); });
cv.addEventListener('contextlost', e => { e.preventDefault(); K.bg.lost = 1; clearTimeout(K.bg.lostT); K.bg.lostT = setTimeout(() => { if (K.bg.lost && K.canReload()) K.reload('contexto do canvas perdido'); }, 3000); });
cv.addEventListener('contextrestored', () => { K.bg.lost = 0; clearTimeout(K.bg.lostT); K.refresh('contextrestored'); });
try { new ResizeObserver(() => resize()).observe(document.documentElement); } catch (e) {}
/* ponto de tela -> coordenadas lógicas do jogo (considera rotação em retrato) */
function toLogical(e) {
  const r = cv.getBoundingClientRect(); let x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
  if (VIEW.rot) { const t = x; x = y; y = -t; }
  return { x: x / VIEW.sc + VW / 2, y: y / VIEW.sc + VH / 2 };
}
K.toLogical = toLogical;
K.fullscreen = () => { try { const d = document.documentElement; if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen({ navigationUI: 'hide' }).then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => {}); } catch (e) {} };
K.buzz = ms => { if (SAVE.opt.hap && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } };

/* ------------------------------------------------------------------ cenas e transições */
const SCENES = K.scenes = {};
K.scene = null; K.sceneName = '';
/* K.defScene(nome, { enter(args) [pode devolver Promise], update(dt), draw(ctx), exit(), resize(), onBlur() }) — registrar de novo o mesmo nome SUBSTITUI */
K.defScene = (name, sc) => { sc.name = name; SCENES[name] = sc; return sc; };
const TR = K.tr = { on: false, t: 0, dur: .35, ph: 0, kind: 'fade', next: null, args: null, cx: .5, cy: .5, wait: false, col: PAL.ink };
/* K.go('select', args, {kind:'iris'|'fade'|'bars'|'wipe', dur, cx, cy (0..1), col}) */
K.go = (name, args, o) => {
  if (TR.on && TR.ph === 0) return; o = o || {};
  if (!SCENES[name]) { console.error('cena inexistente: ' + name); return; }
  Object.assign(TR, { on: true, t: 0, ph: 0, kind: o.kind || 'fade', dur: o.dur || .3, next: name, args, cx: o.cx === undefined ? .5 : o.cx, cy: o.cy === undefined ? .5 : o.cy, wait: false, col: o.col || PAL.ink });
};
function switchScene() {
  if (K.scene && K.scene.exit) { try { K.scene.exit(); } catch (e) { console.error(e); } }
  K.scene = SCENES[TR.next]; K.sceneName = TR.next; K.ui.reset();
  let p; try { p = K.scene.enter ? K.scene.enter(TR.args) : null; } catch (e) { console.error(e); }
  TR.ph = 1; TR.t = 0;
  if (p && p.then) { TR.wait = true; p.then(() => { TR.wait = false; }, e => { console.error(e); TR.wait = false; }); }
}
function trUpdate(dt) {
  if (!TR.on) return; if (TR.wait) return;
  TR.t += dt; if (TR.t >= TR.dur) { if (TR.ph === 0) switchScene(); else TR.on = false; }
}
function trDraw(c) {
  if (!TR.on) return; let k = clamp(TR.t / TR.dur, 0, 1); if (TR.ph === 1) k = TR.wait ? 1 : 1 - k;   // k = quanto está coberto
  if (k <= 0) return;
  c.fillStyle = TR.col;
  if (TR.kind === 'iris') {
    const cx = TR.cx * VW, cy = TR.cy * VH, rmax = Math.hypot(Math.max(cx, VW - cx), Math.max(cy, VH - cy)) + 10, r = rmax * (1 - E.io2(k));
    c.beginPath(); c.rect(0, 0, VW, VH); if (r > 1) c.arc(cx, cy, r, 0, TAU, true); c.fill('evenodd');
  } else if (TR.kind === 'bars') {
    const n = 9, h = VH / n; for (let i = 0; i < n; i++) { const kk = clamp(k * 1.6 - i / n * .6, 0, 1), w = VW * E.out3(kk); c.fillRect(i % 2 ? VW - w : 0, i * h - 1, w, h + 2); }
  } else { c.globalAlpha = k; c.fillRect(0, 0, VW, VH); c.globalAlpha = 1; }
  if (TR.wait) K.loadingDraw(c);
}
K.loadingDraw = c => { K.text(c, 'Afiando o estilingue' + '.'.repeat(1 + (K.time * 3 | 0) % 3), VW / 2, VH / 2 + 10, { size: 26, color: PAL.yellow, align: 'center' }); };

/* ------------------------------------------------------------------ loop */
K.time = 0; K.frame = 0; K.speed = 1; K.fps = 60; let _last = 0, _acc = 0, _fa = 16.7, _slow = 0;
function tick(ts) {
  requestAnimationFrame(tick); K.rafT = performance.now();
  let el = (ts - _last) / 1000; _last = ts; if (!(el > 0)) el = 0; if (el > .1) el = .1;
  _fa += (el * 1000 - _fa) * .05; K.fps = 1000 / _fa;
  // qualidade automática: se o aparelho não acompanha, reduz a resolução do 3D (só em memória)
  if (_fa > 24 && SAVE.opt.qa && K.qRun > 0 && !K.debug.pr && K.sceneName === 'play') { _slow += el; if (_slow > 3) { K.qRun--; _slow = 0; resize(); } } else _slow = Math.max(0, _slow - el * .5);
  _acc += el * K.speed; let n = 0;
  while (_acc >= DT && n < 16) { step(DT); _acc -= DT; n++; }
  if (n >= 16) _acc = 0;
  render();
}
/* 1.2.0 (JGK-NET): avança a simulação SEM desenhar (aba escondida durante sessão online: o requestAnimationFrame para, o relógio em Worker chama isto) */
K.pump = el => { _acc += el * K.speed; let n = 0; while (_acc >= DT && n < 40) { step(DT); _acc -= DT; n++; } if (n >= 40) _acc = 0; _last = performance.now(); };
function step(dt) {
  K.time += dt; K.frame++;
  K.input.poll(); K.audio.tick();
  K.ui.update(dt);
  if (K.scene && !(TR.on && TR.ph === 0 && TR.t > .02) && !TR.wait) { try { K.scene.update && K.scene.update(dt); } catch (e) { if (!K._err) { K._err = e; console.error(e); } } }
  trUpdate(dt); K.input.post();
}
function render() {
  ctx.setTransform(PR, 0, 0, PR, 0, 0);
  if (K.scene && K.scene.draw && !(TR.on && TR.wait)) { try { K.scene.draw(ctx); } catch (e) { if (!K._err2) { K._err2 = e; console.error(e); } } }
  else { ctx.fillStyle = PAL.ink; ctx.fillRect(0, 0, VW, VH); }
  K.ui.flush();
  trDraw(ctx);
  if (K.debug.fps) K.text(ctx, (K.fps | 0) + ' fps  PR ' + PR.toFixed(2), 8, VH - 8, { size: 12, color: '#fff' });
}
K.boot = async first => {
  resize();
  try { if (document.fonts && document.fonts.load) await Promise.race([Promise.all([document.fonts.load("20px 'Permanent Marker'"), document.fonts.load("20px 'Patrick Hand'")]), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  if (K.bake) K.bake();                                    // rasteriza texturas/sprites definidos pelo conteúdo
  resize(); const l = $('load'); if (l) l.style.display = 'none';
  TR.on = true; TR.next = first; TR.args = null; TR.kind = 'fade'; TR.dur = .4; switchScene();
  requestAnimationFrame(t => { _last = t; requestAnimationFrame(tick); });
};

/*==ENGINE:ui-input==  texto/painéis/botões em canvas (estilo caderno), regiões clicáveis com foco, teclado+mouse, gamepad e controles de toque de FPS */
/* ------------------------------------------------------------------ desenho de UI */
const FONT = { mark: "'Permanent Marker','Comic Sans MS','Chalkboard SE',cursive", hand: "'Patrick Hand','Comic Sans MS',cursive" };
/* K.text(c, 'oi', x, y, {size, color, align, base, stroke, sw, font:'mark'|'hand', alpha, shadow, rot, maxW}) */
K.text = (c, s, x, y, o) => {
  o = o || {}; const size = o.size || 20, f = size + 'px ' + (o.font === 'hand' ? FONT.hand : FONT.mark);
  c.save(); if (o.alpha !== undefined) c.globalAlpha *= o.alpha;
  c.font = f; c.textAlign = o.align || 'left'; c.textBaseline = o.base || 'alphabetic'; c.lineJoin = 'round';
  if (o.rot) { c.translate(x, y); c.rotate(o.rot); x = 0; y = 0; }
  const sw = o.sw === undefined ? (o.font === 'hand' ? 0 : Math.max(3, size * .18)) : o.sw, mw = o.maxW;
  if (o.shadow) { c.fillStyle = c.strokeStyle = 'rgba(20,20,43,.5)'; c.lineWidth = sw; if (sw) c.strokeText(s, x, y + o.shadow, mw); c.fillText(s, x, y + o.shadow, mw); }
  if (sw) { c.strokeStyle = o.stroke || PAL.ink; c.lineWidth = sw; c.strokeText(s, x, y, mw); }
  c.fillStyle = o.color || '#fff'; c.fillText(s, x, y, mw); c.restore();
};
K.textW = (c, s, size, font) => { c.save(); c.font = size + 'px ' + (font === 'hand' ? FONT.hand : FONT.mark); const w = c.measureText(s).width; c.restore(); return w; };
K.wrapText = (c, s, size, maxW, font) => {
  c.save(); c.font = size + 'px ' + (font === 'hand' ? FONT.hand : FONT.mark);
  const out = []; for (const par of String(s).split('\n')) { let line = ''; for (const w of par.split(' ')) { const t = line ? line + ' ' + w : w; if (c.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; } out.push(line); }
  c.restore(); return out;
};
K.rr = (c, x, y, w, h, r) => { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
/* painel "adesivo de caderno": papel com contorno de tinta e sombra dura deslocada. K.panel(c,x,y,w,h,{fill,stroke,r,lip,lw,alpha}) */
K.panel = (c, x, y, w, h, o) => {
  o = o || {}; const r = o.r === undefined ? 14 : o.r, lip = o.lip === undefined ? 6 : o.lip;
  c.save(); if (o.alpha !== undefined) c.globalAlpha *= o.alpha;
  if (lip) { K.rr(c, x + lip * .6, y + lip, w, h, r); c.fillStyle = o.lipCol || 'rgba(20,20,43,.55)'; c.fill(); }
  K.rr(c, x, y, w, h, r); c.fillStyle = o.fill || PAL.paper; c.fill();
  if (o.stroke !== null) { c.strokeStyle = o.stroke || PAL.ink; c.lineWidth = o.lw || 4; c.stroke(); }
  c.restore();
};
/* fundo de caderno quadriculado (menus). K.paperBg(c, scroll) */
K.paperBg = (c, t) => {
  c.fillStyle = PAL.paper; c.fillRect(0, 0, VW, VH); c.strokeStyle = PAL.grid; c.lineWidth = 1.5; const g = 36, ox = -((t || 0) * 6 % g), oy = -((t || 0) * 6 % g);
  c.beginPath(); for (let x = ox; x < VW; x += g) { c.moveTo(x, 0); c.lineTo(x, VH); } for (let y = oy; y < VH; y += g) { c.moveTo(0, y); c.lineTo(VW, y); } c.stroke();
  c.strokeStyle = 'rgba(229,56,59,.55)'; c.lineWidth = 3; c.beginPath(); c.moveTo(VIEW.safeL + 70, 0); c.lineTo(VIEW.safeL + 70, VH); c.stroke();
};

/* ------------------------------------------------------------------ regiões clicáveis + foco (UI imediata) */
const UI = K.ui = { cur: [], prev: [], focus: null, press: null, showFocus: false, lock: 0 };
UI.reset = () => { UI.cur = []; UI.prev = []; UI.focus = null; UI.press = null; UI.lock = .15; };
/* Chame DENTRO de draw(): registra retângulo clicável. cb() dispara no toque/clique/Enter. o: {def, back, nofocus, pad} → {focus, down} */
UI.hot = (id, x, y, w, h, cb, o) => {
  o = o || {}; const p = o.pad || 0; UI.cur.push({ id, x: x - p, y: y - p, w: w + p * 2, h: h + p * 2, cb, o });
  return { focus: UI.showFocus && UI.focus === id, down: UI.press === id };
};

/*==ENGINE:game==  mundo, fases, jogador (estilingue), bots (IA por registro), projéteis, itens, portal, HUD, cena 'play'.
 * REGISTROS (conteúdo): K.defWorld · K.defLevel · K.defBot · K.defPickup · K.defProp · K.defSong/K.defSfx (áudio) · K.defStory (história)
 * AJUDANTES para IA/chefes: K.ai.* (ver mais abaixo) · estado vivo em K.G (G.pl = jogador, G.bots = bots vivos+mortos) 
 * 1.2.0 (JGK, N jogadores): G.players[] = todos os jogadores (id, slot, team, local...); G.pl aponta SEMPRE para o jogador LOCAL (câmera, HUD, som).
 *   Toda função de jogador recebe o jogador (pl); sem ele vale o "ator" (G.actor, quem está pegando um item agora) ou o local. No solo, players = [G.pl] e nada muda. */
K.worlds = {}; K.levels = []; K.botDefs = {}; K.pickupDefs = {}; K.propDefs = {}; K.hud = {}; K.menus = {}; K.weapons = {}; K.powerDefs = {};
/* K.defWorld('caderno', {nome, wall:{1:'tex',2:'tex'...}, floor:'tex', ceil:'tex', fog:[r,g,b], fogDist:14, light:1, music:'caderno', cor:'#2D6CDF', base:'caderno' (1.1.0: HERDA todos os campos do mundo base e só sobrescreve o que você passar; `wall` é mesclado tipo a tipo)}) */
K.defWorld = (id, o) => { const b = o.base && K.worlds[o.base]; K.worlds[id] = Object.assign({ fog: [20, 20, 43], fogDist: 14, light: 1, cor: PAL.blue }, b || {}, o, { id, wall: Object.assign({}, b ? b.wall : {}, o.wall || {}) }); };
/* K.defLevel({id:'1', world:'caderno', nome:'...', par:240 (s), hint:'dica', map:[ '####', '#S.#', ...], start:{a:0 (graus; 0 = leste, 90 = sul)}, legend:{c:{bot:'palito'}}, ents:[{t:'palito', x:5.5, y:3.5}], boss:'chefe1', pre:'pre_1', pos:'pos_1'}) */
K.defLevel = o => { o.id = String(o.id); const i = K.levels.findIndex(l => l.id === o.id); if (i >= 0) K.levels[i] = o; else K.levels.push(o); K.levels.sort((a, b) => +a.id - +b.id); };
K.levelById = id => K.levels.find(l => l.id === String(id));
/* K.defBot('palito', {look:'palito', hp:4, speed:1.4, radius:.28, scale:1, score:10, sight:9, poise:0 (1 = não cambaleia), melee:{range:1, dmg:12, windup:.5, cd:1}, shoot:{speed:4.2, dmg:10, windup:.65, cd:2, range:9, spr:'pedra_inimiga', n:1, spread:0}, keep:[3,7] (distância preferida de atirador), boss:true, think(e,dt), phases:[{at:.66, set:{...}, summon:['palito'], say:'texto'}] }) */
K.defBot = (id, o) => { K.botDefs[id] = Object.assign({ id, hp: 3, speed: 1.4, radius: .28, scale: 1, score: 10, sight: 9 }, o); };
/* K.defPickup('curativo', {spr:'curativo', r:.45, take(G, pl, e) → true se consumiu}) · K.defProp('mesa', {spr:'mesa', solid:true, r:.35}) */
/* 1.1.0: defPickup aceita atalhos — {weapon:'id', ammo:n} dá a arma; {power:'id'} dá o poder (a mensagem na tela já é automática). Opcional: col:[r,g,b] (cor das partículas), beam/aura (sprites de destaque) */
K.defPickup = (id, o) => { if (o.weapon && !o.take) o.take = (G, pl) => K.giveWeapon(o.weapon, o.ammo, pl); if (o.power && !o.take) o.take = (G, pl) => K.givePower(o.power, pl); K.pickupDefs[id] = o; }; K.defProp = (id, o) => { K.propDefs[id] = o; };

/* ------------------------------------------------------------------ 1.1.0 · dificuldade crescente
 * Cada fase recebe multiplicadores pela posição na lista (n = 0 na fase 1): vida, velocidade, dano e cadência (cd menor = ataca mais) dos bots e dos chefes.
 * Level Designer pode ajustar por fase: L.tune = {bot:{hp:1.2, spd, dmg, cd}, boss:{...}} (só os campos informados mudam). Aplicado em K.spawnBot (inclui invocados). */
K.defaultTune = n => ({ bot: { hp: 1 + .06 * n, spd: 1 + .02 * n, dmg: 1 + .035 * n, cd: 1 - .015 * n }, boss: { hp: 1 + .04 * n, spd: 1 + .015 * n, dmg: 1 + .03 * n, cd: 1 - .01 * n } });

/* ------------------------------------------------------------------ 1.1.0 · armas (pegas no cenário)
 * K.defWeapon('triplo', { nome:'Leque', sigla:'LEQ' (3 letras, botão de toque), icon:'sprite do HUD', order:10 (ordem na troca),
 *   n:3 (pedras por tiro), spread:.14 (rad entre pedras), cd:.5 (s entre tiros), charge:.5 (s p/ carga cheia; 0 = tiro instantâneo, sem puxar), auto:true (segurando repete; só com charge:0),
 *   dmg:[1,3] (carga mín → cheia), speed:[8.5,17], grav:[1.7,.8], life:3, pierce:0 (nº de bots que atravessa), bounce:0 (nº de quicadas em parede/chão),
 *   explode:{r:1.6, dmg:6} (explode ao acertar/bater; não fere o jogador; ignora armadura), ammo:0 (0 = infinita; N = máximo), ammoPick:N (quanto dá a arma ao ser pega; padrão metade),
 *   proj:'sprite da pedra', sfx:'shoot', msg:'dica curta ao pegar', hud:(c,S)=>{} (desenho em 1ª pessoa; padrão = estilingue; S igual ao de K.hud.weapon) }) */
K.defWeapon = (id, o) => { K.weapons[id] = Object.assign({ id, nome: id, sigla: id.slice(0, 3).toUpperCase(), n: 1, spread: 0, cd: .34, charge: .72, auto: false, dmg: [1, 3], speed: [8.5, 17], grav: [1.7, .8], life: 3, pierce: 0, bounce: 0, explode: null, ammo: 0, order: 50 }, o); };
K.defWeapon('estilingue', { nome: 'Estilingue', sigla: 'EST', order: 0, icon: 'icone_estilingue' });
const actor = () => (G && G.actor) || G.pl;   /* 1.2.0: jogador "da vez" (quem pega o item) — padrão das funções de jogador chamadas pelo conteúdo */

const usableW = (id, pl) => { const W = K.weapons[id]; pl = pl || G.pl; return !!W && (!W.ammo || (pl.ammo[id] || 0) > 0); };

function cycleWeapon(dir, pl) { pl = pl || G.pl; const l = pl.arms.filter(id => usableW(id, pl)); if (l.length < 2) return; setWeapon(l[(l.indexOf(pl.w) + dir + l.length) % l.length], pl); }
/* dá a arma ao jogador agora (no solo a deixa salva em SAVE.arms: volta em toda fase; no multiplayer NÃO grava). Munição soma até o máximo. pl = jogador (padrão: o ator/local) */
K.giveWeapon = (id, ammo, pl) => { const W = K.weapons[id]; if (!W || !G) return false; pl = pl || actor(); if (!G.mp) { SAVE.arms[id] = 1; K.persist(); } if (!pl.arms.includes(id)) { pl.arms.push(id); pl.arms.sort((a, b) => K.weapons[a].order - K.weapons[b].order); }
  if (W.ammo) pl.ammo[id] = Math.min(W.ammo, (pl.ammo[id] || 0) + (ammo || W.ammoPick || Math.ceil(W.ammo * .5))); pl.w = id; pl.pulling = false; pl.charge = 0; if (pl.local) { G.wswT = 2.4; K.ai.say('ARMA NOVA: ' + W.nome + '!' + (W.msg ? ' ' + W.msg : ''), 3.4); } return true; };
/* recarrega a munição de todas as armas com munição (n = fração do máximo, padrão .5); false se nada precisava (pickup fica no chão) */
K.refillAmmo = (f, pl) => { pl = pl || actor(); let ok = false; for (const id of pl.arms) { const W = K.weapons[id]; if (W && W.ammo && (pl.ammo[id] || 0) < W.ammo) { pl.ammo[id] = Math.min(W.ammo, (pl.ammo[id] || 0) + Math.ceil(W.ammo * (f || .5))); ok = true; } } return ok; };

/* ------------------------------------------------------------------ 1.1.0 · poderes (upgrades temporários ou da fase toda)
 * K.defPower('forca', { nome:'Elástico Forte', icon:'sprite', dur:30 (s; 0 = até o fim da fase), mod:{spd:1.25, charge:1.5 (puxa mais rápido), dmg:1.5}, start(pl,G), end(pl,G), msg:'texto' })

/* ---------------------------------------------------------------- link P2P (2 canais) */
/* NET.link(S, peerId, initiator) → L. L.send(obj, rel) · L.onmsg = (obj, rel) => {} · L.onopen · L.onclose(why) · L.close() · L.rtt (ms) */
NET.link = (S, peer, initiator) => {

  const L = { peer, pc, cid, open: false, closed: false, rtt: 0, onmsg: null, onopen: null, onclose: null, pend: [] };
  const rel = pc.createDataChannel('rel', { negotiated: true, id: 0, ordered: true }), fast = pc.createDataChannel('fast', { negotiated: true, id: 1, ordered: false, maxRetransmits: 0 });

  for (const ch of [rel, fast]) { ch.onopen = opened; ch.onclose = () => L.close('fechou'); ch.onmessage = ev => { NET.stats.recv++; NET.stats.bytesIn += ev.data.length || 0; let m; try { m = JSON.parse(ev.data); } catch (e) { return; } if (m.t === 'ping') { L.send({ t: 'pong', k: m.k }, true); return; } if (m.t === 'pong') { L.rtt = L.rtt ? L.rtt * .7 + (performance.now() - m.k) * .3 : performance.now() - m.k; return; } if (L.onmsg) L.onmsg(m, ch === rel); }; }

  L.to = setTimeout(() => { if (!L.open) L.close('rede'); }, NET.cfg.iceTimeout);
  L.sendNow = (obj, r) => { const ch = r ? rel : fast; if (ch.readyState !== 'open') return; const s = JSON.stringify(obj); try { ch.send(s); NET.stats.sent++; NET.stats.bytesOut += s.length; } catch (e) {} };
  L.send = (obj, r) => { const sm = NET.sim; if (!r && sm.loss && Math.random() < sm.loss) { NET.stats.dropped++; return; }
    if (sm.lat || sm.jit) { const s = JSON.stringify(obj), d = Math.max(0, sm.lat + (Math.random() * 2 - 1) * sm.jit); /* 'rel' em ordem mesmo com jitter */ if (r) { L.relT = Math.max(L.relT || 0, performance.now() + d); setTimeout(() => L.sendNow(JSON.parse(s), true), L.relT - performance.now()); } else setTimeout(() => L.sendNow(JSON.parse(s), false), d); return; }
    L.sendNow(obj, r); };

  L.close = why => { if (L.closed) return; L.closed = true; L.open = false; clearTimeout(L.to); clearTimeout(L.dT); try { rel.close(); fast.close(); pc.close(); } catch (e) {} NET.log('link fechado', peer, why); if (L.onclose) L.onclose(why || 'fechou'); };
  /* troca de SDP/ICE pelo signaling */
  L.signal = async m => {
    try {
      if (m.type === 'OFFER') { L.cid = m.payload.connectionId; await pc.setRemoteDescription(m.payload.sdp); const a = await pc.createAnswer(); await pc.setLocalDescription(a); S.send('ANSWER', peer, { sdp: pc.localDescription.toJSON ? pc.localDescription.toJSON() : pc.localDescription, connectionId: L.cid }); for (const c of L.pend) await pc.addIceCandidate(c).catch(() => {}); L.pend = []; }
      else if (m.type === 'ANSWER') { await pc.setRemoteDescription(m.payload.sdp); for (const c of L.pend) await pc.addIceCandidate(c).catch(() => {}); L.pend = []; }
      else if (m.type === 'CANDIDATE') { const c = m.payload.candidate; if (pc.remoteDescription) await pc.addIceCandidate(c).catch(() => {}); else L.pend.push(c); }

  };
  if (initiator) (async () => { try { const o = await pc.createOffer(); await pc.setLocalDescription(o); S.send('OFFER', peer, { sdp: pc.localDescription.toJSON ? pc.localDescription.toJSON() : pc.localDescription, connectionId: cid, type: 'data' }); } catch (e) { L.close('rede'); } })();

};
NET.supported = () => typeof RTCPeerConnection === 'function' && typeof WebSocket === 'function';

/* ---------------------------------------------------------------- relógio de fundo (aba escondida durante sessão online) */
NET.bgClock = (() => {
  let w = null, iv = 0, last = 0;
  const tickBg = () => { const now = performance.now(), el = Math.min(.25, (now - last) / 1000); last = now; NET.bgTicks = (NET.bgTicks || 0) + 1; if (document.hidden && NET.active && K.pump && now - (K.rafT || 0) > 120) K.pump(el); };   /* só avança se o requestAnimationFrame parou de verdade (nunca em dobro) */
  const start = () => { if (w || iv) return; last = performance.now();
    try { const src = 'let i=setInterval(()=>postMessage(0),33);onmessage=()=>{clearInterval(i);close()}'; w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' }))); w.onmessage = tickBg; }
    catch (e) { w = null; iv = setInterval(tickBg, 33); } };
  const stop = () => { if (w) { try { w.postMessage(0); w.terminate(); } catch (e) {} w = null; } if (iv) { clearInterval(iv); iv = 0; } };

/*==ENGINE:net-room==  JGK-NET · camada 2 (genérica, serve a qualquer jogo): modos, times e sala.
 * Não sabe nada de FPS: só jogadores, vagas, times e prontos. A ponte de cada jogo (ex.: 11-mp-fps.js) decide o que é uma "partida".
 * MODOS: K.net.MODES[id] = {nome, teams (nº de times), per (jogadores por time), on (aparece no menu nesta versão)}.
 *   'ffa4' = 4 times de 1 (cada um por si). O 1x1 é só "2 times de 1": o 2x2 usa EXATAMENTE o mesmo caminho de código.

K.net = K.net || {};
K.net.MAX_PLAYERS = 8;
K.net.MODES = {
  '1x1': { nome: '1 contra 1', teams: 2, per: 1, on: true },
  '2x2': { nome: '2 contra 2', teams: 2, per: 2, on: false },
  '3x3': { nome: '3 contra 3', teams: 2, per: 3, on: false },
  '4x4': { nome: '4 contra 4', teams: 2, per: 4, on: false, bigMap: true },
  'ffa4': { nome: 'Cada um por si (4)', teams: 4, per: 1, on: false }

K.net.TEAMS = [{ nome: 'Azul', cor: '#2D6CDF' }, { nome: 'Vermelho', cor: '#E5383B' }, { nome: 'Verde', cor: '#2FB36A' }, { nome: 'Amarelo', cor: '#FFD93D' }];

/* distribui vagas e times: jogador i vai para o time com menos gente (empate: o de menor índice). Devolve a lista nova (não muda a entrada). */
K.net.assignTeams = (players, mode) => {
  const M = K.net.MODES[mode] || K.net.MODES['1x1'], cnt = new Array(M.teams).fill(0), out = [];

};

/* ---------------------------------------------------------------- SALA (anfitrião autoritativo, estrela)
 * K.net.app = {id:'pedrada', v:K.version, proto:1}: o id da sala no signaling é app.id + versão (maior+menor) + '-' + CÓDIGO (ex.: 'pedrada12-K7QX'),

  S.on(m => { if (m.type === 'EXPIRE' && m.src === peer && !L.open) fail({ why: 'sala' }); else if (m.src === peer) L.signal(m); });
  L.onopen = () => L.send({ t: 'hello', app: NET.app.id, v: NET.app.v, proto: NET.app.proto, name: name || 'Convidado' }, true);
  L.onclose = why => { if (!done) fail({ why: why === 'rede' ? 'rede' : 'sala' }); else { NET.emit('hostLeft', why); } };
  L.onmsg = (m, rel) => {
    if (m.t === 'welcome') { done = true; clearTimeout(to); NET.me = m.you; NET.room = m.room; try { S.close(); } catch (e) {} NET.emit('room', NET.room); res(NET.room); return; }

NET.leave = quiet => {

  if (NET.role === 'host') NET.broadcast({ t: 'bye' }, true);

/* ping de todos os links 1×/s (rtt em L.rtt) — chamado pelo laço do jogo via K.net.tick */
NET.tick = dt => { if (!NET.active) return; NR.pingT -= dt; if (NR.pingT > 0) return; NR.pingT = 1; for (const k in NR.links) if (NR.links[k].open) NR.links[k].ping(); if (NR.host && NR.host.open) NR.host.ping(); };
window.addEventListener('pagehide', () => { if (NET.active) NET.leave(true); });

/*==ENGINE:net-sync==  JGK-NET · camada 3 (genérica, serve a qualquer jogo): sincronia com ANFITRIÃO AUTORITATIVO.
 * O jogo entrega um ADAPTADOR (K.net.sync.start(A)) e chama K.net.sync.step(dt) uma vez por passo de simulação, ANTES de mover os jogadores:
 *   A.readCmd()            → comando local (array curto de números: o que o jogador quer neste instante; ex. FPS: [mvx, mvy, mira, pitch, botões])
 *   A.applyCmd(id, cmd, first)  anfitrião: aplica o comando do jogador `id` (first = 1º passo desse comando; bordas como "acabou de apertar" só nele)
 *   A.predictCmd(cmd, first)    convidado: aplica o comando no próprio jogador (previsão: o controle responde na hora)

  if (NET.role === 'host') {

      if (edge || Q.length > SY.catchQ) { const c = Q.shift() || null; if (c) { SY.last[p.id] = c; SY.ack[p.id] = c[0]; A.applyCmd(p.id, c.slice(1), true); } else if (SY.last[p.id]) A.applyCmd(p.id, SY.last[p.id].slice(1), false); }

SY.event = e => { if (SY.on && NET.role === 'host') NET.broadcast({ t: 'ev', e: [e] }, true); };

/* 14-mundos-b.js — mundos `tinta` (fase 8, Lata de Tinta) e `final` (fase 10, A Última Folha, arena do Mestre Apagador) + texturas e props próprios (DONO: Cenógrafo B). 1.1.0.
   tinta: blocos de cor (ciano, magenta, amarelo) com respingos e gotas escorrendo, metal branco de lata. Fundo claro-metálico, névoa azul-tinta (não é o neon: aqui é tinta fosca e chão claro).
   final: vazio de papel branco, manchas de borracha, riscos de lápis (cinza e vermelho), grade apagada. Paredes têm contraste de tinta em cima/embaixo para continuarem legíveis com névoa de qualquer cor/alcance.
   Props: tin_lata tin_pincel tin_poca tin_tubo · fin_borracha fin_lapis fin_apontador fin_rasura fin_bola. */
{
  const INK = PAL.ink, rnd = K.rng(1408);
  const cutP = (c, pathFn, fill, lw) => { lw = lw || 4; c.save(); c.lineJoin = 'round'; c.lineCap = 'round'; c.beginPath(); pathFn(c); c.lineWidth = lw + 5; c.strokeStyle = '#fff'; c.stroke(); c.lineWidth = lw; c.strokeStyle = INK; c.stroke(); if (fill) { c.fillStyle = fill; c.fill(); } c.restore(); };
  const rrP = (x, y, w, h, r) => c => K.rr(c, x, y, w, h, r);
  const poly = pts => c => { pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); };
  const oval = (x, y, rx, ry) => c => c.ellipse(x, y, rx, ry, 0, 0, TAU);
  const shadow = (c, w, h, k) => { c.save(); c.fillStyle = 'rgba(20,20,43,.28)'; c.beginPath(); c.ellipse(w / 2, h - 3, w * (k || .42), 3.4, 0, 0, TAU); c.fill(); c.restore(); };
  const ln = (c, col, lw, pts) => { c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = col; c.lineWidth = lw; c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.stroke(); c.restore(); };

  const tex = (id, base, draw) => K.defTexture(id, { size: 64, draw: (c, s) => { c.fillStyle = base; c.fillRect(0, 0, s, s); draw(c, s); } });

  const grid = (c, s, col, step, w) => { c.fillStyle = col; for (let i = 0; i < s; i += step) { c.fillRect(i, 0, w, s); c.fillRect(0, i, s, w); } };
  const speck = (c, s, col, n, w, h) => { c.fillStyle = col; for (let i = 0; i < n; i++) c.fillRect(rnd() * (s - w) | 0, rnd() * (s - h) | 0, w, h); };
  // desenha em 9 posições deslocadas de 64: o que sair por uma borda entra pela outra (textura sem emenda)

  });

  tex('final_w1', '#F2F2F7', (c, s) => { smudge(c, s, 5, 'rgba(125,130,150,.22)'); grid(c, s, 'rgba(125,130,150,.22)', 16, 1); ln(c, LAP, 2.5, [[8, 46], [30, 40], [52, 48]]); ln(c, LAPC, 2, [[10, 26], [40, 20]]); box(c, '#3B3F58', 0, 0, s, 2); box(c, '#3B3F58', 0, s - 3, s, 3); });

/* 31-bots-a.js — bots NOVOS da 1.1.0: `escudeiro`, `borrachudo`, `enxame` (DONO: Gameplay A). Os looks têm o MESMO id (15-looks-a.js).
   - escudeiro (fase 4+): corpo leva 25% (`armor`), cabeça dano cheio; lento. Ao dar o soco ele ABAIXA o escudo: durante o telegraph (0,7 s) e o golpe fica vulnerável (armor 1) e pisca laranja.

{

  const spot = () => {
    const pl = K.G.pl;
    for (let k = 0; k < 30; k++) {
      const a = Math.random() * 6.283, d = 3 + Math.random() * 1.5, x = pl.x + Math.cos(a) * d, y = pl.y + Math.sin(a) * d;
      if (K.los(x, y, pl.x, pl.y) && K.los(x + .3, y, x - .3, y) && K.los(x, y + .3, x, y - .3)) return [x, y];
    }
    return null;
  };

    hp: 3, speed: 2.4, melee: { range: .95, dmg: 12, windup: .42, cd: 1.5 },
    think(e, dt) {

      if (e.vs === 1) {                                     // sumido (intocável); o motor desconta ghost
        e.vt -= dt; e.facing = false;

          else e.vt = .3;                                    // sem lugar bom: tenta de novo já já
        }

        if (e.vs === 2 && e.rush > 0) { e.rush -= dt; e.cfg.speed = 4.4; } else { e.cfg.speed = e.def.speed; e.vs = 0; }

    hp: 1, speed: 2.6, scale: .7, drop: 0, melee: { range: .8, dmg: 6, windup: .42, cd: 1.2 },

/* 32-bots-b.js — bots NOVOS da 1.1.0: `bombardeiro`, `curandeiro`, `sniper` (DONO: Gameplay B). Looks reais em 16-looks-b.js (mesmo id do bot).

      }
      const pop = E.outBack(clamp(t * 3, 0, 1)); c.save(); c.translate(VW / 2, 84); c.scale(pop, pop);
      K.text(c, r.win ? 'FASE CONCLUÍDA!' : 'OS PALITOS VENCERAM…', 0, 0, { size: 52, align: 'center', color: r.win ? PAL.green : PAL.red, rot: -.025, sw: 11, maxW: VW - 40 }); c.restore();
      K.text(c, L.nome || '', VW / 2, 120, { size: 25, align: 'center', color: PAL.ink2, font: 'hand', sw: 0 });
      const floor = 432, px = sL() + (narrow ? 12 : 60), py = floor - 128 * sc - 8, bx = VW - sR() - (narrow ? 12 : 60) - 96 * sc;   // 1.0.2: chão mais alto — o boneco caído não fica sob o botão "Fases"
      shadow(c, px + 48 * sc, floor + 2, 40 * sc); shadow(c, bx + 48 * sc, floor + 2, 40 * sc);
      if (r.win) {
        K.palito(c, 'palitinho', 'idle', px, py - Math.abs(Math.sin(t * 5)) * 16, sc, t); still(c, 'palito', 'die', -1, bx, py + 22 * sc, sc, true);
        for (let s = 0; s < 3; s++) { const k = E.outBack(clamp(t * 2.2 - .5 - s * .45, 0, 1)); c.save(); c.translate(VW / 2 + (s - 1) * 88, 178 + (s === 1 ? -10 : 0)); c.rotate((s - 1) * .12); K.star(c, 0, 0, 38 * k, r.stars > s); c.restore(); }
        K.text(c, ELOGIO[clamp(r.stars - 1, 0, 2)], VW / 2, 232, { size: 24, align: 'center', color: PAL.ink, font: 'hand', sw: 0, alpha: clamp(t - 1.2, 0, 1) });
      } else {
        still(c, 'palitinho', 'die', -1, px, py + 22 * sc, sc); K.palito(c, 'palito', 'idle', bx, py - Math.abs(Math.sin(t * 6)) * 12, sc, t, true);
        c.save(); c.translate(VW / 2, 166); c.rotate(-.02); K.text(c, this.q, 0, 0, { size: 27, align: 'center', color: PAL.ink, font: 'hand', sw: 0, maxW: VW - 340 }); c.restore();
        if (L.hint) { const hw = Math.min(VW - 80, 600); pad(c, VW / 2 - hw / 2, 184, hw, 46, .015, PAL.yellow); K.text(c, 'Dica: ' + L.hint, VW / 2, 214, { size: 21, align: 'center', color: PAL.ink, font: 'hand', sw: 0, maxW: hw - 30 }); }
      }
      const rows = [['Bots derrubados', r.kills + ' / ' + r.total], ['Tempo', Math.round(r.time) + ' s' + (L.par ? '  (par ' + L.par + ')' : '')], ['Tiros na cabeça', String(r.heads)], ['Pedradas', String(r.shots || 0)], ['Vida restante', r.hp + '%']];
      const pw = 400, pxx = VW / 2 - pw / 2, pyy = 244, rh = 28; K.panel(c, pxx, pyy, pw, rows.length * rh + 22, { r: 10 });
      rows.forEach((l, k) => { const al = clamp(t * 3 - .6 - k * .5, 0, 1); c.save(); c.globalAlpha = al; c.translate((1 - al) * 30, 0); K.text(c, l[0], pxx + 22, pyy + 32 + k * rh, { size: 23, color: PAL.ink, font: 'hand', sw: 0 }); K.text(c, l[1], pxx + pw - 22, pyy + 32 + k * rh, { size: 23, align: 'right', color: PAL.blue, sw: 0 }); c.restore(); });
      if (this.novas && this.novas.length) { const nw = Math.min(VW - 80, 460), ny = 412; pad(c, VW / 2 - nw / 2, ny, nw, 40, -.012, PAL.yellow); K.text(c, 'NOVO: ' + this.novas.join(' + '), VW / 2, ny + 27, { size: 22, align: 'center', color: PAL.red, sw: 0, maxW: nw - 20, alpha: clamp(t - 1.6, 0, 1) }); }
      const by = VH - sB() - 78, bw = Math.min(250, VW / 2 - 70);
      if (r.win && !last) K.ui.button(c, 'prox', VW / 2 - bw - 8, by, bw, 64, 'PRÓXIMA FASE', () => K.startLevel(K.levels[i + 1].id), { def: true, size: 25 });
      else if (r.win) K.ui.button(c, 'fim', VW / 2 - bw - 8, by, bw, 64, 'FINAL', () => K.playStory('fim', () => K.go('credits')), { def: true, size: 30 });
      else K.ui.button(c, 'again', VW / 2 - bw - 8, by, bw, 64, 'TENTAR DE NOVO', () => K.go('play', { level: L.id }, { kind: 'iris' }), { def: true, size: 24 });
      K.ui.button(c, 'menu', VW / 2 + 8, by, bw, 64, r.win ? 'Repetir fase' : 'Menu', () => r.win ? K.go('play', { level: L.id }, { kind: 'iris' }) : K.go('select', null, { kind: 'bars' }), { kind: 'blue', size: 24 });
      K.ui.button(c, 'sel', sL() + 92, VH - sB() - 66, 120, 56, 'Fases', () => K.go('select', null, { kind: 'bars' }), { kind: 'ghost', size: 22, back: true });
    }
  });

  /* ---------- história ---------- */
  K.defScene('story', {
    enter(a) { this.a = a; this.S = K.stories[a.id]; this.i = 0; this.t = 0; this.n = 0; K.input.enabled = true; },
    update(dt) {
      this.t += dt; const pg = this.S.pages[this.i], full = (pg.text || '').length, shown = Math.min(full, this.t * 40 | 0);
      if (shown > this.n && !(shown % 3)) K.sfx('tick'); this.n = shown;
      if (K.in.ok || K.in.any || K.in.tap) { if (shown < full) this.t = 99; else if (this.t > .1) this.next(); }
    },
    next() { this.t = 0; this.n = 0; this.i++; if (this.i >= this.S.pages.length) this.end(); },
    end() { const th = this.a.then; if (th) th(); else K.go('select'); },
    draw(c) {
      bg(c); const pg = this.S.pages[Math.min(this.i, this.S.pages.length - 1)], text = pg.text || '', shown = Math.min(text.length, this.t * 40 | 0), narrow = VW < 800;
      const fx = sL() + 96, fy = 118, fs = narrow ? 150 : 180;
      /* retrato */
      c.save(); c.translate(fx + fs / 2, fy + fs / 2); c.rotate(-.04); c.translate(-fs / 2, -fs / 2);
      K.panel(c, 0, 0, fs, fs, { r: 8, lip: 8 }); c.save(); K.rr(c, 8, 8, fs - 16, fs - 16, 4); c.clip(); c.fillStyle = '#CFE0FF'; c.fillRect(0, 0, fs, fs); hatch(c, 8, 8, fs - 16, fs - 16, '#fff', .5);
      const psc = fs / 64; K.palito(c, pg.look || 'palitinho', 'idle', fs / 2 - 48 * psc, 8 - 5 * psc + Math.sin(K.time * 3) * 2, psc, K.time); c.restore();
      c.strokeStyle = PAL.ink; c.lineWidth = 4; K.rr(c, 8, 8, fs - 16, fs - 16, 4); c.stroke(); c.restore();
      tape(c, fx + fs / 2 - 6, fy + fs + 6, Math.max(120, K.textW(c, pg.who || '', 28) + 30), 38, -.03, PAL.yellow); K.text(c, pg.who || '', fx + fs / 2 - 6, fy + fs + 18, { size: 28, align: 'center', color: PAL.ink, sw: 0, maxW: 170 });
      /* balão */
      const bxl = fx + fs + 44, bw = VW - bxl - sR() - 26, byt = 104, lines = K.wrapText(c, text, 29, bw - 56, 'hand'), bh = clamp(lines.length * 38 + 100, 170, 300);
      c.save(); c.translate(0, 0); K.panel(c, bxl, byt, bw, bh, { r: 22, lip: 8 });
      c.beginPath(); c.moveTo(bxl + 3, byt + 90); c.lineTo(bxl - 30, byt + 120); c.lineTo(bxl + 3, byt + 140); c.fillStyle = PAL.paper; c.fill(); c.strokeStyle = PAL.ink; c.lineWidth = 4; c.lineJoin = 'round'; c.stroke();
      c.fillStyle = PAL.paper; c.fillRect(bxl, byt + 94, 8, 44); c.restore();
      let left = shown;
      lines.forEach((ln, k) => { const part = ln.slice(0, Math.max(0, left)); left -= ln.length + 1; if (part) K.text(c, part, bxl + 28, byt + 54 + k * 36, { size: 29, color: PAL.ink, font: 'hand', sw: 0 }); });
      for (let k = 0; k < this.S.pages.length; k++) { c.beginPath(); c.arc(bxl + 34 + k * 20, byt + bh - 24, 6, 0, T2); c.fillStyle = k === this.i ? PAL.red : PAL.paper2; c.fill(); c.strokeStyle = PAL.ink; c.lineWidth = 2.5; c.stroke(); }
      if (shown >= text.length) K.text(c, 'toque / Enter ▶', bxl + bw - 24, byt + bh - 18, { size: 22, align: 'right', color: PAL.red, font: 'hand', sw: 0, alpha: .6 + Math.sin(K.time * 6) * .4 });
      K.ui.button(c, 'skip', VW - sR() - 150, VH - sB() - 66, 130, 56, 'Pular', () => this.end(), { kind: 'ghost', size: 22, nofocus: true });
    }
  });

  /* ---------- créditos ---------- */
  K.defScene('credits', {
    enter() { this.t = 0; K.music('titulo'); }, update(dt) { this.t += dt; },
    draw(c) {
      bg(c); const t = this.t; K.text(c, 'PEDRADA DE PALITO', VW / 2, 52, { size: 50, align: 'center', color: PAL.red, rot: -.02, sw: 11, maxW: VW - 50 });
      pad(c, VW / 2 - 64, 70, 128, 32, .03, PAL.yellow); K.text(c, 'versão ' + K.version, VW / 2, 92, { size: 21, align: 'center', color: PAL.ink, font: 'hand', sw: 0 });
      /* 1.0.4 — CRÉDITOS PADRÃO DO TIME JAVAROTTI (regra 19 da skill): 1) Desenvolvido e Dirigido por, 2) time de IA especificado, 3) Motor JGK. Mesmo formato em todo jogo. */
      const notes = [['Desenvolvido e Dirigido por: Pedro Javarotti', PAL.yellow], ['Feito por um time de IA (agentes Javarotti)', PAL.paper], ['Gerente: Sonnet (esforço alto) · agentes: Sonnet (esforço médio)', '#DCE8FF'], ['Motor JGK · Javarotti Game Kit', PAL.yellow], ['Arte 100% procedural: papel, tinta e palitinhos', PAL.paper], ['Obrigado por jogar!', '#FFE9A8']];
      notes.forEach((n, k) => { const w = Math.min(VW - 120, 680), x = VW / 2 - w / 2 + (k % 2 ? 10 : -10); pad(c, x, 114 + k * 41, w, 34, (k % 2 ? .01 : -.01), n[1]); K.text(c, n[0], x + w / 2, 114 + k * 41 + 18, { size: 21, align: 'center', color: PAL.ink, font: 'hand', sw: 0, maxW: w - 24 }); });
      const floor = 508, sc = 1.0; ground(c, floor, 0, VW); const looks = ['palitinho', 'palito', 'corredor', 'gordao', 'atirador'], span = VW + 300;
      /* 1.0.2: quem marcha nunca passa por TRÁS do botão Voltar: some (fade) antes de chegar na coluna do botão e só aparece depois dela */
      looks.forEach((lk, k) => { const x = ((t * (lk === 'corredor' ? 70 : 52) - k * 190) % span + span) % span - 150, al = clamp((x + 48 * sc - (sL() + 280)) / 80, 0, 1); if (al <= 0) return;
        c.save(); c.globalAlpha = al; shadow(c, x + 48 * sc, floor + 2, 42); K.palito(c, lk, 'walk', x, floor - 128 * sc - 8, sc, t * (lk === 'corredor' ? 1.5 : 1) + k); c.restore(); });
      backBtn(c);
    }
  });
}

}
