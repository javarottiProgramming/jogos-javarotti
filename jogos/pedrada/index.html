<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Pedrada de Palito 1.0.7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
html,body{height:100%;margin:0;background:#14142B;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#wrap{position:fixed;left:50%;top:50%;overflow:hidden;background:#14142B;touch-action:none}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;image-rendering:auto;cursor:crosshair}
#safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#load{position:fixed;inset:0;display:grid;place-items:center;font:28px 'Permanent Marker','Comic Sans MS',cursive;color:#FFD93D;background:#14142B;z-index:9}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="safe"></div>
<div id="load">Apontando o estilingue…</div>
<script>
/*==ENGINE:core==  núcleo: utilitários, canvas, loop de passo fixo, cenas, transições, save. (motor JGK-FPS — Javarotti Game Kit, módulos de gênero em primeira pessoa) */
'use strict';
const K = window.K = { version: '1.0.7', /* suba a cada rodada de correções: título, créditos e <title> leem daqui */ debug: window.__KDBG || {} };
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2, VH = 540, DT = 1 / 120;
let VW = 960, PR = 1;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const R = (a, b) => a + Math.random() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = a => a[Math.random() * a.length | 0];
const sign = v => v > 0 ? 1 : v < 0 ? -1 : 0;
const appr = (v, t, s) => v < t ? Math.min(v + s, t) : Math.max(v - s, t);
const damp = (a, b, l, dt) => a + (b - a) * (1 - Math.exp(-l * dt));
const chance = (p, dt) => Math.random() < p * dt;          // p = eventos por segundo
function rng(seed) { let s = seed >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const E = {                                                 // curvas de easing (t em 0..1)
  lin: t => t, in2: t => t * t, out2: t => 1 - (1 - t) * (1 - t), io2: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  out3: t => 1 - Math.pow(1 - t, 3), in3: t => t * t * t,
  outBack: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * TAU / 3) + 1
};
Object.assign(K, { clamp, lerp, R, RI, pick, sign, appr, damp, chance, rng, E, TAU, VH, DT });

/* ------------------------------------------------------------------ paleta de UI (papel + tinta + marcadores; NUNCA marrom/sépia) */
const PAL = K.pal = { ink: '#14142B', ink2: '#2A2A55', paper: '#F7F5EE', paper2: '#E6EAF5', grid: '#BFD3F2', blue: '#2D6CDF', blue2: '#1B4AA8', red: '#E5383B', red2: '#A3151A', yellow: '#FFD93D', yellow2: '#C99A00', green: '#2FB36A', chalk: '#EDEFE6' };

/* ------------------------------------------------------------------ save */
const SAVE_KEY = 'pedrada.v1.save';
/* done['1'] = {st:1..3 estrelas, kills, t, hp}  ·  opt: sv/mv volumes 0-100, sens 1..10, inv (inverter Y), assist (mira assistida), q/qa qualidade, bsz/balpha toque, shake 0/1, hap */
const SAVE = K.save = { done: {}, seen: {}, intro: 0, end: 0, opt: { sv: 100, mv: 70, sens: 5, inv: 0, assist: 1, q: 1, qa: 1, bsz: 1, balpha: .55, shake: 1, hap: 1, fov: 1 } };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s) Object.assign(SAVE, s, { opt: Object.assign(SAVE.opt, s.opt || {}) }); } catch (e) {}
SAVE.opt.snd = SAVE.opt.sv > 0 ? 1 : 0; SAVE.opt.mus = SAVE.opt.mv > 0 ? 1 : 0;
/* qualidade: qa=1 → automático (só reduz em memória, nunca grava); qa=0 → escolha manual do jogador, respeitada sempre (regra 13) */
K.qRun = 1; const QEFF = K.qEff = () => SAVE.opt.qa ? Math.min(K.qRun, 2) : SAVE.opt.q;
K.qLabel = () => 'Gráficos: ' + (SAVE.opt.qa ? 'automático' : ['leves', 'médios', 'altos'][SAVE.opt.q]);
K.qCycle = () => { const o = SAVE.opt; if (o.qa) { o.qa = 0; o.q = 0; } else if (o.q < 2) o.q++; else { o.qa = 1; K.qRun = 1; } if (typeof resize === 'function') resize(); K.persist(); };
K.persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {} };
K.resetSave = () => { SAVE.done = {}; SAVE.seen = {}; SAVE.intro = 0; SAVE.end = 0; K.persist(); };

/* ------------------------------------------------------------------ canvas / viewport */
const cv = $('cv'), ctx = cv.getContext('2d', { alpha: false }), wrap = $('wrap');
const VIEW = K.view = { rot: false, sc: 1, safeL: 0, safeR: 0, safeT: 0, safeB: 0, touch: false };
function readSafe() {
  const p = $('safe'); if (!p) return; const cs = getComputedStyle(p), f = k => (parseFloat(cs[k]) || 0) / VIEW.sc;
  const l = f('paddingLeft'), r = f('paddingRight'), t = f('paddingTop'), b = f('paddingBottom');
  if (VIEW.rot) { VIEW.safeL = t; VIEW.safeR = b; VIEW.safeT = r; VIEW.safeB = l; } else { VIEW.safeL = l; VIEW.safeR = r; VIEW.safeT = t; VIEW.safeB = b; }
}
function resize() {
  const iw = window.innerWidth || 960, ih = window.innerHeight || 540, rot = ih > iw * 1.02;
  const W = rot ? ih : iw, H = rot ? iw : ih;
  VIEW.rot = rot; wrap.style.width = W + 'px'; wrap.style.height = H + 'px';
  wrap.style.transform = 'translate(-50%,-50%)' + (rot ? ' rotate(90deg)' : '');
  VW = clamp(Math.round(VH * W / H), 720, 1300);
  const sc = Math.min(W / VW, H / VH); VIEW.sc = sc;
  cv.style.width = Math.round(VW * sc) + 'px'; cv.style.height = Math.round(VH * sc) + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 3), cap = [1, 1.5, 2][QEFF()] || 1.5;
  PR = clamp(sc * dpr, .6, cap); if (K.debug.pr) PR = K.debug.pr;
  cv.width = Math.round(VW * PR); cv.height = Math.round(VH * PR);
  K.VW = VW; K.PR = PR; readSafe();
  if (K.r3 && K.r3.resize) K.r3.resize();
  if (K.scene && K.scene.resize) K.scene.resize();
}
window.addEventListener('resize', resize); window.addEventListener('orientationchange', () => setTimeout(resize, 120));
/* ponto de tela -> coordenadas lógicas do jogo (considera rotação em retrato) */
function toLogical(e) {
  const r = cv.getBoundingClientRect(); let x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
  if (VIEW.rot) { const t = x; x = y; y = -t; }
  return { x: x / VIEW.sc + VW / 2, y: y / VIEW.sc + VH / 2 };
}
K.toLogical = toLogical;
K.fullscreen = () => { try { const d = document.documentElement; if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen({ navigationUI: 'hide' }).then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => {}); } catch (e) {} };
K.buzz = ms => { if (SAVE.opt.hap && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } };

/* ------------------------------------------------------------------ cenas e transições */
const SCENES = K.scenes = {};
K.scene = null; K.sceneName = '';
/* K.defScene(nome, { enter(args) [pode devolver Promise], update(dt), draw(ctx), exit(), resize(), onBlur() }) — registrar de novo o mesmo nome SUBSTITUI */
K.defScene = (name, sc) => { sc.name = name; SCENES[name] = sc; return sc; };
const TR = K.tr = { on: false, t: 0, dur: .35, ph: 0, kind: 'fade', next: null, args: null, cx: .5, cy: .5, wait: false, col: PAL.ink };
/* K.go('select', args, {kind:'iris'|'fade'|'bars'|'wipe', dur, cx, cy (0..1), col}) */
K.go = (name, args, o) => {
  if (TR.on && TR.ph === 0) return; o = o || {};
  if (!SCENES[name]) { console.error('cena inexistente: ' + name); return; }
  Object.assign(TR, { on: true, t: 0, ph: 0, kind: o.kind || 'fade', dur: o.dur || .3, next: name, args, cx: o.cx === undefined ? .5 : o.cx, cy: o.cy === undefined ? .5 : o.cy, wait: false, col: o.col || PAL.ink });
};
function switchScene() {
  if (K.scene && K.scene.exit) { try { K.scene.exit(); } catch (e) { console.error(e); } }
  K.scene = SCENES[TR.next]; K.sceneName = TR.next; K.ui.reset();
  let p; try { p = K.scene.enter ? K.scene.enter(TR.args) : null; } catch (e) { console.error(e); }
  TR.ph = 1; TR.t = 0;
  if (p && p.then) { TR.wait = true; p.then(() => { TR.wait = false; }, e => { console.error(e); TR.wait = false; }); }
}
function trUpdate(dt) {
  if (!TR.on) return; if (TR.wait) return;
  TR.t += dt; if (TR.t >= TR.dur) { if (TR.ph === 0) switchScene(); else TR.on = false; }
}
function trDraw(c) {
  if (!TR.on) return; let k = clamp(TR.t / TR.dur, 0, 1); if (TR.ph === 1) k = TR.wait ? 1 : 1 - k;   // k = quanto está coberto
  if (k <= 0) return;
  c.fillStyle = TR.col;
  if (TR.kind === 'iris') {
    const cx = TR.cx * VW, cy = TR.cy * VH, rmax = Math.hypot(Math.max(cx, VW - cx), Math.max(cy, VH - cy)) + 10, r = rmax * (1 - E.io2(k));
    c.beginPath(); c.rect(0, 0, VW, VH); if (r > 1) c.arc(cx, cy, r, 0, TAU, true); c.fill('evenodd');
  } else if (TR.kind === 'bars') {
    const n = 9, h = VH / n; for (let i = 0; i < n; i++) { const kk = clamp(k * 1.6 - i / n * .6, 0, 1), w = VW * E.out3(kk); c.fillRect(i % 2 ? VW - w : 0, i * h - 1, w, h + 2); }
  } else { c.globalAlpha = k; c.fillRect(0, 0, VW, VH); c.globalAlpha = 1; }
  if (TR.wait) K.loadingDraw(c);
}
K.loadingDraw = c => { K.text(c, 'Afiando o estilingue' + '.'.repeat(1 + (K.time * 3 | 0) % 3), VW / 2, VH / 2 + 10, { size: 26, color: PAL.yellow, align: 'center' }); };

/* ------------------------------------------------------------------ loop */
K.time = 0; K.frame = 0; K.speed = 1; K.fps = 60; let _last = 0, _acc = 0, _fa = 16.7, _slow = 0;
function tick(ts) {
  requestAnimationFrame(tick);
  let el = (ts - _last) / 1000; _last = ts; if (!(el > 0)) el = 0; if (el > .1) el = .1;
  _fa += (el * 1000 - _fa) * .05; K.fps = 1000 / _fa;
  // qualidade automática: se o aparelho não acompanha, reduz a resolução do 3D (só em memória)
  if (_fa > 24 && SAVE.opt.qa && K.qRun > 0 && !K.debug.pr && K.sceneName === 'play') { _slow += el; if (_slow > 3) { K.qRun--; _slow = 0; resize(); } } else _slow = Math.max(0, _slow - el * .5);
  _acc += el * K.speed; let n = 0;
  while (_acc >= DT && n < 16) { step(DT); _acc -= DT; n++; }
  if (n >= 16) _acc = 0;
  render();
}
function step(dt) {
  K.time += dt; K.frame++;
  K.input.poll(); K.audio.tick();
  K.ui.update(dt);
  if (K.scene && !(TR.on && TR.ph === 0 && TR.t > .02) && !TR.wait) { try { K.scene.update && K.scene.update(dt); } catch (e) { if (!K._err) { K._err = e; console.error(e); } } }
  trUpdate(dt); K.input.post();
}
function render() {
  ctx.setTransform(PR, 0, 0, PR, 0, 0);
  if (K.scene && K.scene.draw && !(TR.on && TR.wait)) { try { K.scene.draw(ctx); } catch (e) { if (!K._err2) { K._err2 = e; console.error(e); } } }
  else { ctx.fillStyle = PAL.ink; ctx.fillRect(0, 0, VW, VH); }
  K.ui.flush();
  trDraw(ctx);
  if (K.debug.fps) K.text(ctx, (K.fps | 0) + ' fps  PR ' + PR.toFixed(2), 8, VH - 8, { size: 12, color: '#fff' });
}
K.boot = async first => {
  resize();
  try { if (document.fonts && document.fonts.load) await Promise.race([Promise.all([document.fonts.load("20px 'Permanent Marker'"), document.fonts.load("20px 'Patrick Hand'")]), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  if (K.bake) K.bake();                                    // rasteriza texturas/sprites definidos pelo conteúdo
  resize(); const l = $('load'); if (l) l.style.display = 'none';
  TR.on = true; TR.next = first; TR.args = null; TR.kind = 'fade'; TR.dur = .4; switchScene();
  requestAnimationFrame(t => { _last = t; requestAnimationFrame(tick); });
};

/*==ENGINE:ui-input==  texto/painéis/botões em canvas (estilo caderno), regiões clicáveis com foco, teclado+mouse, gamepad e controles de toque de FPS */
/* ------------------------------------------------------------------ desenho de UI */
const FONT = { mark: "'Permanent Marker','Comic Sans MS','Chalkboard SE',cursive", hand: "'Patrick Hand','Comic Sans MS',cursive" };
/* K.text(c, 'oi', x, y, {size, color, align, base, stroke, sw, font:'mark'|'hand', alpha, shadow, rot, maxW}) */
K.text = (c, s, x, y, o) => {
  o = o || {}; const size = o.size || 20, f = size + 'px ' + (o.font === 'hand' ? FONT.hand : FONT.mark);
  c.save(); if (o.alpha !== undefined) c.globalAlpha *= o.alpha;
  c.font = f; c.textAlign = o.align || 'left'; c.textBaseline = o.base || 'alphabetic'; c.lineJoin = 'round';
  if (o.rot) { c.translate(x, y); c.rotate(o.rot); x = 0; y = 0; }
  const sw = o.sw === undefined ? (o.font === 'hand' ? 0 : Math.max(3, size * .18)) : o.sw, mw = o.maxW;
  if (o.shadow) { c.fillStyle = c.strokeStyle = 'rgba(20,20,43,.5)'; c.lineWidth = sw; if (sw) c.strokeText(s, x, y + o.shadow, mw); c.fillText(s, x, y + o.shadow, mw); }
  if (sw) { c.strokeStyle = o.stroke || PAL.ink; c.lineWidth = sw; c.strokeText(s, x, y, mw); }
  c.fillStyle = o.color || '#fff'; c.fillText(s, x, y, mw); c.restore();
};
K.textW = (c, s, size, font) => { c.save(); c.font = size + 'px ' + (font === 'hand' ? FONT.hand : FONT.mark); const w = c.measureText(s).width; c.restore(); return w; };
K.wrapText = (c, s, size, maxW, font) => {
  c.save(); c.font = size + 'px ' + (font === 'hand' ? FONT.hand : FONT.mark);
  const out = []; for (const par of String(s).split('\n')) { let line = ''; for (const w of par.split(' ')) { const t = line ? line + ' ' + w : w; if (c.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; } out.push(line); }
  c.restore(); return out;
};
K.rr = (c, x, y, w, h, r) => { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
/* painel "adesivo de caderno": papel com contorno de tinta e sombra dura deslocada. K.panel(c,x,y,w,h,{fill,stroke,r,lip,lw,alpha}) */
K.panel = (c, x, y, w, h, o) => {
  o = o || {}; const r = o.r === undefined ? 14 : o.r, lip = o.lip === undefined ? 6 : o.lip;
  c.save(); if (o.alpha !== undefined) c.globalAlpha *= o.alpha;
  if (lip) { K.rr(c, x + lip * .6, y + lip, w, h, r); c.fillStyle = o.lipCol || 'rgba(20,20,43,.55)'; c.fill(); }
  K.rr(c, x, y, w, h, r); c.fillStyle = o.fill || PAL.paper; c.fill();
  if (o.stroke !== null) { c.strokeStyle = o.stroke || PAL.ink; c.lineWidth = o.lw || 4; c.stroke(); }
  c.restore();
};
/* fundo de caderno quadriculado (menus). K.paperBg(c, scroll) */
K.paperBg = (c, t) => {
  c.fillStyle = PAL.paper; c.fillRect(0, 0, VW, VH); c.strokeStyle = PAL.grid; c.lineWidth = 1.5; const g = 36, ox = -((t || 0) * 6 % g), oy = -((t || 0) * 6 % g);
  c.beginPath(); for (let x = ox; x < VW; x += g) { c.moveTo(x, 0); c.lineTo(x, VH); } for (let y = oy; y < VH; y += g) { c.moveTo(0, y); c.lineTo(VW, y); } c.stroke();
  c.strokeStyle = 'rgba(229,56,59,.55)'; c.lineWidth = 3; c.beginPath(); c.moveTo(VIEW.safeL + 70, 0); c.lineTo(VIEW.safeL + 70, VH); c.stroke();
};

/* ------------------------------------------------------------------ regiões clicáveis + foco (UI imediata) */
const UI = K.ui = { cur: [], prev: [], focus: null, press: null, showFocus: false, lock: 0 };
UI.reset = () => { UI.cur = []; UI.prev = []; UI.focus = null; UI.press = null; UI.lock = .15; };
/* Chame DENTRO de draw(): registra retângulo clicável. cb() dispara no toque/clique/Enter. o: {def, back, nofocus, pad} → {focus, down} */
UI.hot = (id, x, y, w, h, cb, o) => {
  o = o || {}; const p = o.pad || 0; UI.cur.push({ id, x: x - p, y: y - p, w: w + p * 2, h: h + p * 2, cb, o });
  return { focus: UI.showFocus && UI.focus === id, down: UI.press === id };
};
/* Botão padrão. K.ui.button(c,'jogar',x,y,w,h,'Jogar',cb,{kind:'pri'|'blue'|'red'|'ghost', size, def, back, icon(c,cx,cy)}) */
UI.button = (c, id, x, y, w, h, label, cb, o) => {
  o = o || {}; const st = UI.hot(id, x, y, w, h, cb, o), kind = o.kind || 'pri';
  const col = { pri: [PAL.yellow, PAL.yellow2, PAL.ink], blue: [PAL.blue, PAL.blue2, '#fff'], red: [PAL.red, PAL.red2, '#fff'], ghost: [PAL.paper, PAL.grid, PAL.ink], green: [PAL.green, '#1d7d4a', '#fff'] }[kind];
  const lip = st.down ? 2 : 7, dy = st.down ? 5 : 0, r = Math.min(16, h / 2.6);
  K.rr(c, x, y + dy + lip, w, h, r); c.fillStyle = PAL.ink; c.fill();
  K.rr(c, x, y + dy, w, h, r); c.fillStyle = col[0]; c.fill(); c.strokeStyle = PAL.ink; c.lineWidth = 4; c.stroke();
  c.save(); K.rr(c, x + 5, y + dy + 4, w - 10, h * .3, r * .6); c.fillStyle = 'rgba(255,255,255,.28)'; c.fill(); c.restore();
  if (st.focus) { K.rr(c, x - 6, y + dy - 6, w + 12, h + lip + 12, r + 6); c.strokeStyle = PAL.red; c.lineWidth = 3 + Math.sin(K.time * 8); c.setLineDash([10, 6]); c.stroke(); c.setLineDash([]); }
  if (o.icon) o.icon(c, x + w / 2, y + dy + h / 2);
  if (label) K.text(c, label, x + w / 2, y + dy + h / 2 + 1, { size: o.size || Math.min(26, h * .46), color: col[2], align: 'center', base: 'middle', sw: 0, maxW: w - 16 });
  return st;
};
/* linha de volume 0–100: K.ui.vol(c, id, x, y, w, h, 'Efeitos', 'sv', size) */
UI.vol = (c, id, x, y, w, h, label, key, size) => {
  const o = SAVE.opt, v = o[key], b = h, mx = x + b + 8, mw = w - (b + 8) * 2;
  const step = d => { K.setVol(key, o[key] + d); K.persist(); if (key === 'sv') K.sfx('ui'); };
  UI.button(c, id + 'm', x, y, b, h, '−', () => step(-10), { kind: 'ghost', size: size + 6 });
  UI.button(c, id + 'p', x + w - b, y, b, h, '+', () => step(10), { kind: 'ghost', size: size + 6 });
  K.rr(c, mx, y, mw, h, 12); c.fillStyle = PAL.paper2; c.fill();
  if (v > 0) { c.save(); K.rr(c, mx, y, mw, h, 12); c.clip(); c.fillStyle = PAL.blue; c.fillRect(mx, y, mw * v / 100, h); c.restore(); }
  K.rr(c, mx, y, mw, h, 12); c.strokeStyle = PAL.ink; c.lineWidth = 4; c.stroke();
  K.text(c, label + ': ' + (v ? v + '%' : 'mudo'), mx + mw / 2, y + h / 2 + 1, { size, color: v > 50 ? '#fff' : PAL.ink, align: 'center', base: 'middle', sw: 0, maxW: mw - 12 });
};
UI.flush = () => { UI.prev = UI.cur; UI.cur = []; };
UI.at = (x, y) => { for (let i = UI.prev.length - 1; i >= 0; i--) { const r = UI.prev[i]; if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r; } return null; };
UI.fire = r => { if (!r || UI.lock > 0 || K.tr.on) return; try { K.sfx('ui'); r.cb && r.cb(); } catch (e) { console.error(e); } };
UI.update = dt => {
  if (UI.lock > 0) UI.lock -= dt; const L = UI.prev.filter(r => !r.o.nofocus), I = K.in;
  if (!L.length) return;
  let f = L.find(r => r.id === UI.focus);
  if (!f) { f = L.find(r => r.o.def) || L[0]; UI.focus = f.id; }
  const dx = (I.mR ? 1 : 0) - (I.mL ? 1 : 0), dy = (I.mD ? 1 : 0) - (I.mU ? 1 : 0);

/* 30-bots.js — bots e chefes: stats e comportamento (DONO: Programador de Gameplay).

{
  /* Envolve K.ai.base: pre(e,dt) pode assumir o turno (retorna true); done(e) roda quando um golpe acaba (strike→chase). */
  const wrap = (pre, done) => (e, dt) => {

  const kite = (e, dt) => {

/* 41-audio.js — músicas e efeitos (DONO: Compositor). Versão 2: supera o stub do gerente.

      if (r.win) {
        K.palito(c, 'palitinho', 'idle', px, py - Math.abs(Math.sin(t * 5)) * 16, sc, t); still(c, 'palito', 'die', -1, bx, py + 22 * sc, sc, true);
        for (let s = 0; s < 3; s++) { const k = E.outBack(clamp(t * 2.2 - .5 - s * .45, 0, 1)); c.save(); c.translate(VW / 2 + (s - 1) * 88, 178 + (s === 1 ? -10 : 0)); c.rotate((s - 1) * .12); K.star(c, 0, 0, 38 * k, r.stars > s); c.restore(); }
        K.text(c, ELOGIO[clamp(r.stars - 1, 0, 2)], VW / 2, 232, { size: 24, align: 'center', color: PAL.ink, font: 'hand', sw: 0, alpha: clamp(t - 1.2, 0, 1) });
      } else {
        still(c, 'palitinho', 'die', -1, px, py + 22 * sc, sc); K.palito(c, 'palito', 'idle', bx, py - Math.abs(Math.sin(t * 6)) * 12, sc, t, true);
        c.save(); c.translate(VW / 2, 166); c.rotate(-.02); K.text(c, this.q, 0, 0, { size: 27, align: 'center', color: PAL.ink, font: 'hand', sw: 0, maxW: VW - 340 }); c.restore();
        if (L.hint) { const hw = Math.min(VW - 80, 600); pad(c, VW / 2 - hw / 2, 184, hw, 46, .015, PAL.yellow); K.text(c, 'Dica: ' + L.hint, VW / 2, 214, { size: 21, align: 'center', color: PAL.ink, font: 'hand', sw: 0, maxW: hw - 30 }); }
      }
      const rows = [['Bots derrubados', r.kills + ' / ' + r.total], ['Tempo', Math.round(r.time) + ' s' + (L.par ? '  (par ' + L.par + ')' : '')], ['Tiros na cabeça', String(r.heads)], ['Pedradas', String(r.shots || 0)], ['Vida restante', r.hp + '%']];
      const pw = 400, pxx = VW / 2 - pw / 2, pyy = 244, rh = 28; K.panel(c, pxx, pyy, pw, rows.length * rh + 22, { r: 10 });
      rows.forEach((l, k) => { const al = clamp(t * 3 - .6 - k * .5, 0, 1); c.save(); c.globalAlpha = al; c.translate((1 - al) * 30, 0); K.text(c, l[0], pxx + 22, pyy + 32 + k * rh, { size: 23, color: PAL.ink, font: 'hand', sw: 0 }); K.text(c, l[1], pxx + pw - 22, pyy + 32 + k * rh, { size: 23, align: 'right', color: PAL.blue, sw: 0 }); c.restore(); });
      const by = VH - sB() - 78, bw = Math.min(250, VW / 2 - 70);
      if (r.win && !last) K.ui.button(c, 'prox', VW / 2 - bw - 8, by, bw, 64, 'PRÓXIMA FASE', () => K.startLevel(K.levels[i + 1].id), { def: true, size: 25 });
      else if (r.win) K.ui.button(c, 'fim', VW / 2 - bw - 8, by, bw, 64, 'FINAL', () => K.playStory('fim', () => K.go('credits')), { def: true, size: 30 });
      else K.ui.button(c, 'again', VW / 2 - bw - 8, by, bw, 64, 'TENTAR DE NOVO', () => K.go('play', { level: L.id }, { kind: 'iris' }), { def: true, size: 24 });
      K.ui.button(c, 'menu', VW / 2 + 8, by, bw, 64, r.win ? 'Repetir fase' : 'Menu', () => r.win ? K.go('play', { level: L.id }, { kind: 'iris' }) : K.go('select', null, { kind: 'bars' }), { kind: 'blue', size: 24 });
      K.ui.button(c, 'sel', sL() + 92, VH - sB() - 66, 120, 56, 'Fases', () => K.go('select', null, { kind: 'bars' }), { kind: 'ghost', size: 22, back: true });
    }
  });

  /* ---------- história ---------- */
  K.defScene('story', {
    enter(a) { this.a = a; this.S = K.stories[a.id]; this.i = 0; this.t = 0; this.n = 0; K.input.enabled = true; },
    update(dt) {
      this.t += dt; const pg = this.S.pages[this.i], full = (pg.text || '').length, shown = Math.min(full, this.t * 40 | 0);
      if (shown > this.n && !(shown % 3)) K.sfx('tick'); this.n = shown;
      if (K.in.ok || K.in.any || K.in.tap) { if (shown < full) this.t = 99; else if (this.t > .1) this.next(); }
    },
    next() { this.t = 0; this.n = 0; this.i++; if (this.i >= this.S.pages.length) this.end(); },
    end() { const th = this.a.then; if (th) th(); else K.go('select'); },
    draw(c) {
      bg(c); const pg = this.S.pages[Math.min(this.i, this.S.pages.length - 1)], text = pg.text || '', shown = Math.min(text.length, this.t * 40 | 0), narrow = VW < 800;
      const fx = sL() + 96, fy = 118, fs = narrow ? 150 : 180;
      /* retrato */
      c.save(); c.translate(fx + fs / 2, fy + fs / 2); c.rotate(-.04); c.translate(-fs / 2, -fs / 2);
      K.panel(c, 0, 0, fs, fs, { r: 8, lip: 8 }); c.save(); K.rr(c, 8, 8, fs - 16, fs - 16, 4); c.clip(); c.fillStyle = '#CFE0FF'; c.fillRect(0, 0, fs, fs); hatch(c, 8, 8, fs - 16, fs - 16, '#fff', .5);
      const psc = fs / 64; K.palito(c, pg.look || 'palitinho', 'idle', fs / 2 - 48 * psc, 8 - 5 * psc + Math.sin(K.time * 3) * 2, psc, K.time); c.restore();
      c.strokeStyle = PAL.ink; c.lineWidth = 4; K.rr(c, 8, 8, fs - 16, fs - 16, 4); c.stroke(); c.restore();
      tape(c, fx + fs / 2 - 6, fy + fs + 6, Math.max(120, K.textW(c, pg.who || '', 28) + 30), 38, -.03, PAL.yellow); K.text(c, pg.who || '', fx + fs / 2 - 6, fy + fs + 18, { size: 28, align: 'center', color: PAL.ink, sw: 0, maxW: 170 });
      /* balão */
      const bxl = fx + fs + 44, bw = VW - bxl - sR() - 26, byt = 104, lines = K.wrapText(c, text, 29, bw - 56, 'hand'), bh = clamp(lines.length * 38 + 100, 170, 300);
      c.save(); c.translate(0, 0); K.panel(c, bxl, byt, bw, bh, { r: 22, lip: 8 });
      c.beginPath(); c.moveTo(bxl + 3, byt + 90); c.lineTo(bxl - 30, byt + 120); c.lineTo(bxl + 3, byt + 140); c.fillStyle = PAL.paper; c.fill(); c.strokeStyle = PAL.ink; c.lineWidth = 4; c.lineJoin = 'round'; c.stroke();
      c.fillStyle = PAL.paper; c.fillRect(bxl, byt + 94, 8, 44); c.restore();
      let left = shown;
      lines.forEach((ln, k) => { const part = ln.slice(0, Math.max(0, left)); left -= ln.length + 1; if (part) K.text(c, part, bxl + 28, byt + 54 + k * 36, { size: 29, color: PAL.ink, font: 'hand', sw: 0 }); });
      for (let k = 0; k < this.S.pages.length; k++) { c.beginPath(); c.arc(bxl + 34 + k * 20, byt + bh - 24, 6, 0, T2); c.fillStyle = k === this.i ? PAL.red : PAL.paper2; c.fill(); c.strokeStyle = PAL.ink; c.lineWidth = 2.5; c.stroke(); }
      if (shown >= text.length) K.text(c, 'toque / Enter ▶', bxl + bw - 24, byt + bh - 18, { size: 22, align: 'right', color: PAL.red, font: 'hand', sw: 0, alpha: .6 + Math.sin(K.time * 6) * .4 });
      K.ui.button(c, 'skip', VW - sR() - 150, VH - sB() - 66, 130, 56, 'Pular', () => this.end(), { kind: 'ghost', size: 22, nofocus: true });
    }
  });

  /* ---------- créditos ---------- */
  K.defScene('credits', {
    enter() { this.t = 0; K.music('titulo'); }, update(dt) { this.t += dt; },
    draw(c) {
      bg(c); const t = this.t; K.text(c, 'PEDRADA DE PALITO', VW / 2, 52, { size: 50, align: 'center', color: PAL.red, rot: -.02, sw: 11, maxW: VW - 50 });
      pad(c, VW / 2 - 64, 70, 128, 32, .03, PAL.yellow); K.text(c, 'versão ' + K.version, VW / 2, 92, { size: 21, align: 'center', color: PAL.ink, font: 'hand', sw: 0 });
      /* 1.0.4 — CRÉDITOS PADRÃO DO TIME JAVAROTTI (regra 19 da skill): 1) Desenvolvido e Dirigido por, 2) time de IA especificado, 3) Motor JGK. Mesmo formato em todo jogo. */
      const notes = [['Desenvolvido e Dirigido por: Pedro Javarotti', PAL.yellow], ['Feito por um time de IA (agentes Javarotti)', PAL.paper], ['Gerente: Sonnet (esforço alto) · 11 agentes: Sonnet (esforço médio)', '#DCE8FF'], ['Motor JGK · Javarotti Game Kit', PAL.yellow], ['Arte 100% procedural: papel, tinta e palitinhos', PAL.paper], ['Obrigado por jogar!', '#FFE9A8']];
      notes.forEach((n, k) => { const w = Math.min(VW - 120, 680), x = VW / 2 - w / 2 + (k % 2 ? 10 : -10); pad(c, x, 114 + k * 41, w, 34, (k % 2 ? .01 : -.01), n[1]); K.text(c, n[0], x + w / 2, 114 + k * 41 + 18, { size: 21, align: 'center', color: PAL.ink, font: 'hand', sw: 0, maxW: w - 24 }); });
      const floor = 508, sc = 1.0; ground(c, floor, 0, VW); const looks = ['palitinho', 'palito', 'corredor', 'gordao', 'atirador'], span = VW + 300;
      /* 1.0.2: quem marcha nunca passa por TRÁS do botão Voltar: some (fade) antes de chegar na coluna do botão e só aparece depois dela */
      looks.forEach((lk, k) => { const x = ((t * (lk === 'corredor' ? 70 : 52) - k * 190) % span + span) % span - 150, al = clamp((x + 48 * sc - (sL() + 280)) / 80, 0, 1); if (al <= 0) return;
        c.save(); c.globalAlpha = al; shadow(c, x + 48 * sc, floor + 2, 42); K.palito(c, lk, 'walk', x, floor - 128 * sc - 8, sc, t * (lk === 'corredor' ? 1.5 : 1) + k); c.restore(); });
      backBtn(c);
    }
  });
}

}
