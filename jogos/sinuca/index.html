/*==ENGINE:debug==  K.debug: atalhos de teste (regra 21: toda mecânica nasce com a ferramenta de teste).
 * window.__KDBG = { first, firstArgs, nosave, noRender, semente } antes do boot (tools/play.js e smoke.js usam).
 *   K.debug.state()        → estado resumido (cena, erros, partida) · K.debug.run(seg) → simula sem desenhar e devolve state()
 *   K.debug.bot(true)      → a IA joga pelos DOIS lados (prova que a partida termina) · K.debug.fastCpu = true pensa rápido
 *   K.debug.shoot(graus, força 0..1, {f, s}) → tacada direta (como o jogador) · K.debug.place(x, y) bola branca na mão
 *   K.debug.rack(lista)    → monta bolas [{id,x,y}] na mesa atual · K.debug.quick(mesa, rival) → abre uma partida
 *   K.debug.give(n)        → créditos · K.debug.up(id, nível) · K.debug.planets() abre todos */
const D = K.debug;
D.state = () => { const M = K.sceneName === 'partida' ? K.G : null;
  return { cena: K.sceneName, err: K._err ? String(K._err.stack || K._err).slice(0, 300) : null, err2: K._err2 ? String(K._err2).slice(0, 200) : null, fps: Math.round(K.fps), versao: K.version,
    audio: K.audio.c ? K.audio.c.state : 'sem contexto', musica: K.audio.name, historia: !!K.ui.st, botoes: K.ui.list().length,
    partida: M ? { fase: M.fase, vez: M.vez, tacadas: M.tacadas, faltas: M.faltas, grupos: M.grupos, naMesa: M.S.balls.filter(b => !b.in).map(b => b.id), nan: M.S.balls.some(b => !isFinite(b.x) || !isFinite(b.y)), venceu: M.venceu } : null,
    done: !!D.done, won: !!D.won }; };
D.run = secs => { const keep = D.noRender; D.noRender = true; const n = Math.round(secs / DT); for (let i = 0; i < n; i++) { K.step(DT); if (D.stopWhen && D.stopWhen()) break; } D.noRender = keep; return D.state(); };
D.bot = on => { D.botOn = on; if (K.G && K.sceneName === 'partida') { K.G.bot = on; if (on && (K.G.fase === 'mira' || K.G.fase === 'mao')) K.scenes.partida.cpuStart(K.G); } };
D.shoot = (deg, pow, fx) => { const M = K.G; if (!M) return 'sem partida'; M.ang = deg * Math.PI / 180; M.pow = pow; M.fx = fx || { f: 0, s: 0 }; M.fase = 'mira'; K.scenes.partida.shootNow(M); return M.fase; };
D.place = (x, y) => { const c = K.G.S.balls[0]; c.x = x; c.y = y; c.in = false; K.G.fase = 'mira'; };
D.rack = list => { const M = K.G; M.S.balls = [{ id: 0, x: M.T.head.x, y: M.T.head.y }].concat(list).map(b => Object.assign({ vx: 0, vy: 0, in: false, f: 0, s: 0 }, b)); M.quebra = false; };
D.quick = (mesa, rival, o) => { o = o || {}; D.semExplica = !o.explica; const pt = !rival && K.planets().flatMap(pl => pl.partidas.map(p => ({ p, pl }))).find(x => x.p.mesa === mesa);   /* sem rival: o da partida da campanha que usa a mesa (2.0: antes caía na ZYX) */
  return K.partida({ mesa: mesa || 'classica', rival: rival || (pt ? pt.p.rival : Object.keys(REG.rival)[0]), planeta: o.planeta, depois: () => {} }); };   // 3º argumento { explica: true } mostra a explicação da mesa (por padrão o teste pula)
D.ready = () => !K.tr.on && !!K.scene;
D.dif = id => { if (!SAVE.game) K.newGame(id); SAVE.game.dif = id; K.persist(); return K.dif(); };
D.give = n => { if (!SAVE.game) K.newGame(); SAVE.game.creditos += n; K.persist(); };
D.up = (id, n) => { if (!SAVE.game) K.newGame(); SAVE.game.up[id] = n; };
D.planets = () => { if (!SAVE.game) K.newGame(); K.planets().forEach(pl => pl.partidas.forEach(p => SAVE.game.vencidas[p.id] = 1)); };
/* física isolada (sem cena): D.sim(mesa, bolas, ang, pow) → estado final, para testes de mesa */
D.sim = (mesa, balls, deg, pow, fx, max) => { const T = PL.prep(REG.table[mesa]); const S = { balls: balls.map(b => Object.assign({ vx: 0, vy: 0, in: false, f: 0, s: 0 }, b)), t: 0, log: [] }; PL.shoot(S, deg * Math.PI / 180, pow, fx); PL.simulate(S, T, max || 15); return S; };

{
/*==CONTENT:mesas==  DONO: designer de mesas A (MVP 0.2.0). Mesas: hangar7 (clássica), empenada (pano em ondas), brasil (formato temático).
 * K.defTable(id, { nome, w, h, poly | polys, pockets: [{x,y,r,boca?}], hgt(x,y) (relevo), nivel (passo das curvas de nível), atrito(x,y), forca(b,dt,S),
 *   bumpers: [{x,y,r,k,cor}], head, foot, kitchen, feltro, borda, bordaLuz, bordaSombra, regra, musica, desenho(g,s,pad) (enfeite fixo), desenhoVivo(g,MV,t),
 *   ganchos: { avaliar(M, r) } })     — K.tableRect({...}) monta a retangular de 6 caçapas e aceita os mesmos extras.
 * Teste de mesa: npm run qa:fisica (todas as mesas: ninguém atravessa parede, ninguém fica NaN, a quebra assenta em < 25 s).
 * Arte: tudo em cores sólidas, pixel de jogo = 2×2 px da camada hi-res (nada de anti-alias, ruído ou pontilhado). Proibido marrom/sépia/madeira. */
{
  /* ---- ferramentas de desenho pixelado (na camada hi-res o pixel do jogo mede 2×2) ---- */
  const GP = (g, x, y, c) => { g.fillStyle = c; g.fillRect(Math.round(x) * 2, Math.round(y) * 2, 2, 2); };          // 1 pixel do jogo, em coordenadas do jogo
  const linha = (g, x0, y0, x1, y1, c) => { x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);                  // Bresenham em pixels do jogo
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy;
    for (;;) { GP(g, x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } } };
  const sprite = (g, mapa, px, py, cores) => mapa.forEach((row, j) => [...row].forEach((ch, i) => { if (cores[ch]) GP(g, px + i, py + j, cores[ch]); }));     // mapa de caracteres → pixels
  const disco = (g, cx, cy, r2, c) => { const n = Math.ceil(Math.sqrt(r2)); for (let j = -n; j <= n; j++) for (let i = -n; i <= n; i++) if (i * i + j * j <= r2) GP(g, cx + i, cy + j, c); };

  /* ================= 1 · HANGAR 7 · clássica (partida 1) =================
   * Mesa dentro da nave do reality estacionada no Acre: pano verde-laser, trilho de aço com rebites, logo "GALÁXIA DE TACO" discreto no pano
   * e luzes de alerta rosa piscando devagar nos cantos (camada viva, bem sutil: as bolas continuam sendo o destaque). */
  {
    const F = '#27C468', LOGO = K.mix(F, '#FFFFFF', .36), RING = K.mix(F, '#FFFFFF', .5);
    const REBITE = ['.ooo.', 'oLBBo', 'oBBBo', 'oBBDo', '.ooo.'], RC = { o: '#1B2236', L: '#FFFFFF', B: '#AEBAD6', D: '#6A7694' };
    const LAMPAS = [[17, -4.95, 0], [239, -4.95, 1], [17, 132.95, 1], [239, 132.95, 0], [-4.95, 17, 1], [-4.95, 111, 0], [260.95, 17, 0], [260.95, 111, 1]];   // [x, y, fase] em u
    K.defTable('hangar7', K.tableRect({ nome: 'Hangar 7', feltro: F, borda: '#6A7794', bordaLuz: '#B9C5DE', bordaSombra: '#202840', nivel: 3,
      desenho(g, s, pad) {
        g.imageSmoothingEnabled = false;
        const X = x => (pad + x * s) / 2, Y = y => (pad + y * s) / 2;                      // u → pixel do jogo
        // rebites no trilho (entre os diamantes de mira)
        for (const x of [32, 96, 160, 224]) for (const y of [-4.95, 132.95]) sprite(g, REBITE, Math.round(X(x)) - 2, Math.round(Y(y)) - 2, RC);
        for (const y of [48, 80]) for (const x of [-4.95, 260.95]) sprite(g, REBITE, Math.round(X(x)) - 2, Math.round(Y(y)) - 2, RC);
        // logo discreto: planeta com anel + "GALÁXIA DE TACO", mais claro que o pano, cores sólidas
        const cx = X(128), cy = Y(64), w = K.tw('GALÁXIA DE TACO', 1), x0 = Math.round(cx - w / 2), y0 = Math.round(cy + 5);
        K.txt(g, 'GALÁXIA DE TACO', x0 * 2, y0 * 2, { c: LOGO, o: null, s: 2 });
        const px = Math.round(cx), py = Math.round(cy - 6);
        const anel = frente => { for (let a = 0; a < 360; a += 3) { const r = a * Math.PI / 180, ex = Math.cos(r) * 8.5, ey = Math.sin(r) * 2.4, c = -.32;
          if (frente ? Math.sin(r) < 0 : Math.sin(r) >= 0) continue; GP(g, px + ex * Math.cos(c) - ey * Math.sin(c), py + ex * Math.sin(c) + ey * Math.cos(c), RING); } };
        anel(false); disco(g, px, py, 10, LOGO); anel(true);
        g.imageSmoothingEnabled = true;
      },
      desenhoVivo(h, V, t) {                                                                  // luzes de alerta nos cantos: pulso lento, quantizado em 4 níveis (sem borrão)
        const lv = [['#4A2040', 0], ['#8A2C64', .08], ['#D2367F', .15], ['#FF4FA3', .22]];
        for (const [ux, uy, fase] of LAMPAS) {
          const k = Math.min(3, Math.floor((.5 + .5 * Math.sin(t * 2.6 + fase * Math.PI)) * 4)), [cor, halo] = lv[k], x = Math.round(V.ox + ux * V.s), y = Math.round(V.oy + uy * V.s);

          K.rect(h, x - 2, y - 1, 4, 2, cor); if (k >= 2) K.rect(h, x - 2, y - 1, 2, 1, '#FFFFFF');            // lente (brilho só quando acende)

  }

  /* ================= 2 · MESA EMPENADA · pano em ondas (partida 2) =================
   * Mesa velha de bar que empenou: o pano ondula, sem lado alto nem lado baixo. 0.3.5 (Pedro: "desde a 1ª tacada todas as bolas ficavam presas no canto direito, enfileiradas"):
   * a versão antiga era uma ladeira para a direita que passava de 0,17 perto do trilho, e a quebra mandava as 15 bolas para a tabela (medido: 77% delas ali, colunas de até 14).
   * Agora o relevo é uma onda de MÉDIA ZERO: h = A·sen(kx·x + 0,9·sen(ky·y)), A = 0,55, λx = 100 u, λy = 110 u (as curvas de nível saem onduladas de verdade).
   * Ladeira máxima 0,045 (≈ 40 u/s², menos que o atrito de rolamento MU = 45): bola parada NUNCA anda sozinha, nenhum canto vira ralo, e a bola em movimento só entorta:
   * tacada forte (≥ 0,9) desvia < 0,5 u até o fim da mesa, tacada média ~1 u e tacada MUITO fraca até ~6 u (quase 2 bolas). Quem manda na curva é a força. A IA simula com a mesma física. */
  {

    const F = '#2B83AD', ONDA = [K.mix(F, '#FFFFFF', .34), K.mix(F, '#FFFFFF', .5)];
    K.defTable('empenada', K.tableRect({ nome: 'Mesa Empenada', feltro: F, borda: '#6F7F98', bordaLuz: '#A4B2C8', bordaSombra: '#2A3348', nivel: .4, hgt,
      desenho(g, s, pad) {
        g.imageSmoothingEnabled = false;
        const X = x => (pad + x * s) / 2, Y = y => (pad + y * s) / 2;
        // três ondas (~) em fila, a do meio mais clara: a marca da mesa que empenou (cada uma tem 12 × 5 pixels do jogo)
        [0, 1, 2].forEach(i => { const x0 = Math.round(X(100 + i * 20)), y0 = Math.round(Y(64)) - 2, c = ONDA[i === 1 ? 1 : 0];
          [[0, 3], [1, 2], [2, 1], [3, 0], [4, 0], [5, 1], [6, 2], [7, 3], [8, 4], [9, 4], [10, 3], [11, 2]].forEach(([dx, dy]) => { GP(g, x0 + dx, y0 + dy, c); GP(g, x0 + dx, y0 + dy + 1, c); }); });
        // "calço" dobrado de papel no pé que bambeia, em cinza frio, na quina de baixo (trilho)
        sprite(g, ['.cccccc.', 'cLLLLLDc', 'cLLLLDDc', '.cccccc.'], Math.round(X(236)) - 4, Math.round(Y(133)) - 1, { c: '#2A3348', L: '#C9D3E4', D: '#8796B0' });
        g.imageSmoothingEnabled = true;
      } }));
  }

  /* ================= 3 · MAPA DO BRASIL · formato temático (partida 3) =================
   * Contorno simplificado (lon/lat projetados em 176×152 u). Seis caçapas nas pontas: Monte Caburaí (norte), Oiapoque (nordeste), Ponta do Seixas (leste),
   * Chuí (sul), canto sudoeste do Mato Grosso do Sul e o extremo oeste do Acre. Largura útil ≥ 4 bolas (23 u) em todo lugar, fora as pontas (o sul foi "engordado" na ponta do Chuí
   * para a caçapa ficar alcançável). A mesa é maior que a clássica (a tela encolhe o conjunto para caber); o rack fica no coração do país (Mato Grosso → Bahia). */
  {
    const W = 176, H = 152;
    const LL = [[-51.6, 4.4], [-50.0, 1.9], [-50.3, -0.1], [-46.0, -1.0], [-44.4, -2.5], [-38.5, -3.7], [-35.3, -5.2], [-34.8, -7.2], [-35.9, -9.8], [-38.5, -13.0], [-39.1, -17.5], [-40.3, -20.3],
      [-41.9, -22.9], [-44.5, -23.3], [-48.0, -25.0], [-48.6, -28.0], [-50.8, -31.0], [-53.4, -33.75], [-55.0, -31.9], [-57.6, -30.2], [-55.0, -27.4], [-54.6, -25.6], [-54.3, -24.0],
      [-57.9, -22.1], [-58.2, -16.3], [-60.4, -13.8], [-63.0, -12.4], [-65.3, -9.8], [-68.8, -11.0], [-72.8, -9.4], [-74.0, -7.6], [-72.5, -5.0], [-70.0, -4.2], [-69.8, 0.9], [-67.1, 1.8],
      [-64.0, 4.0], [-61.5, 5.0], [-60.2, 5.27], [-59.8, 1.7], [-56.5, 2.0], [-54.6, 2.3]];
    const poly = LL.map(([lo, la]) => [+((lo + 74) / 39.2 * W).toFixed(1), +((5.3 - la) / 39.05 * H).toFixed(1)]);
    const PONTAS = [37, 0, 7, 17, 23, 30];            // Caburaí · Oiapoque · Ponta do Seixas · Chuí · Mato Grosso do Sul (Pantanal) · Acre (índices do contorno)
    const pockets = PONTAS.map(i => { const n = poly.length, V = poly[i], a = poly[(i + n - 1) % n], b = poly[(i + 1) % n], u1 = [a[0] - V[0], a[1] - V[1]], u2 = [b[0] - V[0], b[1] - V[1]], l1 = Math.hypot(...u1), l2 = Math.hypot(...u2);
      let bx = u1[0] / l1 + u2[0] / l2, by = u1[1] / l1 + u2[1] / l2; const bl = Math.hypot(bx, by) || 1; bx /= bl; by /= bl;       // bissetriz para dentro do país
      return { x: +(V[0] + bx * 5.2).toFixed(1), y: +(V[1] + by * 5.2).toFixed(1), r: 6.5, boca: 8.6 }; });

    K.defTable('brasil', { nome: 'Mapa do Brasil', w: W, h: H, poly, pockets, feltro: F, borda: '#EBC12D', bordaLuz: '#FFE985', bordaSombra: '#0E2C6B', aro: '#2A56B8', aroLuz: '#7FA2F0', nivel: 3,
      head: { x: 66, y: 60 }, foot: { x: 124, y: 60 }, kitchen: 80,
      desenho(g, s, pad) {                                                                    // losango da bandeira + disco, só contorno sutil, no centro do país
        g.imageSmoothingEnabled = false;

/*==CONTENT:mesas==  DONO: designer de mesas B (MVP 0.2.0). Mesas: controle (formato temático, partida 4), disco (formato temático, FINAL da Terra, partida 5).
 * Contrato: K.defTable(id, { nome, w, h, poly | polys, pockets: [{x,y,r,boca?}], bumpers: [{x,y,r,k,cor}], head, foot, kitchen, feltro, borda..., musica, desenho(g,s,pad), desenhoVivo(h,{ox,oy,s},t) }).

  /* ================================================================================================================ LUA (2.0): 7 rivais do condomínio lunar
   * Traço marcante de cada um na faixa y 10–28 (a que a partida recorta): lente ciano (Tião), orelhas de ponta rosa (Coelho), bigode e óculos no capacete (Valdir),
   * chamas azuis e sobrancelhas (Impacto), fone com LEDs (DJ), quepe e bigode de tentáculo (Maré), rosto de lua craterado com óculos (Síndico). */
  const ROVER = R('#E0EAFB', '#9AAECE', '#6479A8', '#27346A'), PANEL = R('#6FA0FF', '#2F5FD0', '#1F3D96', '#0C1A5E'), DUST = R('#F4F4FB', '#C4C8DA', '#8F94B2', '#3E4270'),
    PINK = R('#FFE0EE', '#FF9DC6', '#E0629C', '#7A2052'), ROCK = R('#A9B2DA', '#646E9E', '#414878', '#181C48'), FLAME = R('#BFF2FF', '#3F8CFF', '#2A56E0', '#0C1A78'),
    FLAME2 = R('#FFFFFF', '#BDEBFF', '#6FC0FF', '#2A70E0'), NIGHT = R('#8196F2', '#4A64CA', '#31419A', '#121A58'), HOOD = R('#3E4488', '#1D2150', '#11143A', '#05061C'),
    CORAL = R('#FFCBCB', '#FF8E9E', '#D9546F', '#6E1B48'), NAVY = R('#3E58B8', '#1E2E78', '#131C52', '#080D2E'), MOON = R('#FFFFFF', '#E8ECF8', '#B6C0DC', '#5A6498'),
    CRATER = R('#F8F9FF', '#CBD3EC', '#98A4CE', '#5A6498');
  /* gira uma forma em torno de (cx,cy); ring = aro entre dois raios; arc = pontos de uma circunferência entre dois ângulos */
  const rot = (shape, cx, cy, deg) => { const a = -deg * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a); return (x, y) => { const dx = x + .5 - cx, dy = y + .5 - cy; return shape(Math.floor(cx + dx * ca - dy * sa), Math.floor(cy + dx * sa + dy * ca)); }; };
  const ring = (cx, cy, r1, r2) => sub(ell(cx, cy, r1, r1), ell(cx, cy, r2, r2));
  const arc = (c, cx, cy, r, a0, a1, col) => { for (let a = a0; a <= a1; a += 3) c.set(Math.round(cx + r * Math.cos(a * Math.PI / 180)), Math.round(cy + r * Math.sin(a * Math.PI / 180)), col); };
  /* olho redondo e simples: esclera, íris, pupila, brilho */
  const olho = (c, x, y, iris) => { c.fill(ell(x + 2.5, y + 2.5, 2.7, 2.7), '#F4F8FF'); c.rect(x + 1, y + 1, 3, 3, iris); c.set(x + 2, y + 2, '#0A0E26'); c.set(x + 1, y + 1, '#FFFFFF'); };

  /* ================================================================== TIÃO ROVER: robô esquecido (olho ciano) */
  function tiao(c, f) {
    bg(c);
    c.paint(or(rbox(2, 38, 12, 47, 3), rbox(35, 38, 45, 47, 3)), R('#4A5A9E', '#222C62', '#151C48', '#080C26'), { k: 1 });                // esteiras
    for (let y = 40; y < 47; y += 2) { c.rect(4, y, 6, 1, '#6A7AC0'); c.rect(37, y, 6, 1, '#6A7AC0'); }
    c.paint(rbox(8, 36, 39, 47, 3), ROVER);                                                                                           // corpo
    c.paint(box(20, 32, 27, 38), PIPE); c.rect(20, 35, 8, 1, PIPE.ol);                                                                // pescoço
    c.paint(rbox(14, 40, 25, 44, 1), DARK, { k: 1 }); c.rect(15, 42, 3, 1, LIME.base); c.rect(19, 42, 2, 1, RED.base); c.rect(22, 42, 2, 1, TEAL.base);   // painel de luzes
    c.paint(rbox(7, 12, 40, 35, 4), ROVER);                                                                                           // cabeça de caixa
    [[10, 15], [37, 15], [10, 31], [37, 31]].forEach(([x, y]) => { c.set(x, y, ROVER.ol); c.set(x - 1, y - 1, ROVER.hi); });             // parafusos

/* ---------------------------------------------------------------- RESTO DA TRILHA (compositor) — a 'abertura' acima está APROVADA e não mexe.
 * "Reality interestelar": cada música tem andamento, modo, base rítmica e timbres próprios (fora dos BPMs dos outros jogos: ver docs/AUDIO_BIBLE.md).
 * Gerador de notas: nn(midi) → 'c#4' · mi('c#4') → midi · nt('c#4', 3) → 'e4'. Cada compasso = 16 passos (semicolcheias) e vai separado por ' | '.
 * mix(g, trilhas) multiplica o volume de todas as trilhas (ajuste fino do nível da música inteira, medido por npm run ouvir). */
const PCS = ['c', 'c#', 'd', 'd#', 'e', 'f', 'f#', 'g', 'g#', 'a', 'a#', 'b'];
const mi = s => { const m = /^([a-g]#?)(\d)$/.exec(s); return PCS.indexOf(m[1]) + (+m[2] + 1) * 12; };
const nn = m => PCS[m % 12] + (Math.floor(m / 12) - 1);
const nt = (s, k) => nn(mi(s) + k);
const tp = (pat, k) => pat.replace(/[a-g]#?\d/g, x => nt(x, k));                      // transpõe todas as notas de um padrão
const mix = (g, tracks) => tracks.map(t => Object.assign(t, { vol: +(t.vol * g).toFixed(3) }));
const comp = (n, f) => Array.from({ length: n }, (_, i) => f(i)).join(' | ');         // n compassos, um por chamada de f(i)
const mk = (n, f) => Array.from({ length: n }, (_, i) => f(i));

 * Pausa de câmera: cordas em acordes de 8 s, vibrafone em frases curtas com muito silêncio no meio, baixo de dedo na raiz, sinos raros no eco. Sem bateria, nada que dispute com o texto.
 * Os compassos 8 e 16 só têm o acorde respirando (o "plano aberto" antes de voltar ao começo). */
{
  const CH = {   // r raiz grave · pad (cordas) · hi (dupla alta das cordas sintéticas, só na 2ª metade)
    F: { r: 42, pad: 'c#4+f#4+a4', hi: 'c#5+f#5' }, D: { r: 38, pad: 'd4+f#4+a4', hi: 'd5+f#5' }, A: { r: 33, pad: 'c#4+e4+a4', hi: 'e5+a5' },
    E: { r: 40, pad: 'b3+e4+g#4', hi: 'e5+g#5' }, Bm: { r: 35, pad: 'd4+f#4+b4', hi: 'd5+b5' }, Cm: { r: 37, pad: 'c#4+e4+g#4', hi: 'e5+g#5' } };
  const SEQ = 'F D A E F D Bm Cm'.split(' ');
  const MEL = ['a4:4 -:4 c#5:4 e5:8 -:12', 'f#5:6 e5:2 d5:8 -:16', 'e5:4 -:4 a5:4 g#5:4 e5:8 -:8', 'b4:8 e5:8 g#5:6 f#5:2 -:8',
    'c#5:4 -:4 a4:4 f#4:8 -:12', 'd5:4 f#5:4 a5:8 f#5:4 -:12', 'b4:4 d5:4 f#5:8 d5:4 b4:4 -:8', 'g#4:8 c#5:8 e5:12 -:4'];
  K.defSong('lua_historia', { bpm: 60, echo: { ms: 240, fb: .55, vol: .42, lp: 2200 }, tracks: mix(1.6, [
    { inst: 'cordas', vol: .65, pan: -.15, gate: 1, echo: .3, pat: SEQ.map(c => CH[c].pad + ':32').join(' | ') },
    { inst: 'cordas_syn', vol: .4, pan: .3, gate: 1, echo: .3, pat: SEQ.map((c, i) => i < 4 ? '-:32' : CH[c].hi + ':32').join(' | ') },
    { inst: 'vibra', vol: .6, pan: .1, gate: .9, echo: .5, pat: MEL.join(' | ') },
    { inst: 'baixo_dedo', vol: .18, gate: .95, pat: SEQ.map((c, i) => i === 7 ? sq([[CH[c].r, 8], [null, 24]]) : sq([[CH[c].r, 24], [null, 8]])).join(' | ') },
    { inst: 'sinos', vol: .35, pan: .4, gate: .6, echo: .8, pat: SEQ.map((c, i) => i === 3 ? 'e6:4 -:28' : i === 7 ? 'g#6:4 -:28' : '-:32').join(' | ') } ]) });
}

}
{
/*==CONTENT:sfx==  DONO: compositor (efeitos). Nomes que o MOTOR dispara (mantenha): tacada bola tabela cacapa rebatedor falta ui ui_ok ui_volta erro comprar vitoria derrota dialogo_passa
 * K.defSfx(nome, (tone, noise, smp) => {...})  · tone(onda, f0, f1, dur, vol, atraso) · noise(dur, vol, freq, atraso, destino, t0, Q, tipo) · smp(inst, nota, dur, vol, pan)
 * FORÇA: o motor chama K.sfx('tacada', .4 + pow*.6), K.sfx('bola', v/300) e K.sfx('tabela', v/300): o 2º argumento vira o ganho de um nó (K.audio._d) e só some quando ≥ .99.
 * Aqui lemos esse ganho (gv) para mudar o TIMBRE, não só o volume: tacada fraca = "tuc" grave e curto; tacada forte = estalo agudo com corpo e um "pum" de mesa. Bola e tabela idem.
 * Batida de bola: curta (≤ 60 ms), nítida (clique agudo + corpo médio). Os efeitos têm vozes próprias (não gastam as 8 da música).
 * G(k, fn) multiplica o volume de todas as camadas do efeito por k (ajuste de nível medido em render offline: ver docs/AUDIO_BIBLE.md). */
const S = K.defSfx;
const G = (k, fn) => (t, n, s) => fn((...a) => { a[4] *= k; return t(...a); }, (...a) => { a[1] *= k; return n(...a); }, (...a) => { a[3] *= k; return s(...a); });
const gv = () => { const d = K.audio && K.audio._d; return d ? d.gain.value : 1; };                // ganho passado ao K.sfx (1 = cheio)
const cl01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const nn_ = m => ['c', 'c#', 'd', 'd#', 'e', 'f', 'f#', 'g', 'g#', 'a', 'a#', 'b'][m % 12] + (Math.floor(m / 12) - 1);          // número MIDI → nome ('f1')
S('tacada', G(4, (t, n, s) => { const f = cl01((gv() - .4) / .6);                                  // f: 0 = toque, 1 = tacada cheia
  s('estalo', 62 + Math.round(f * 7), .06, .5 + f * .4); n(.02 + f * .02, .3 + f * .3, 2800 + f * 1800, 0, null, 0, 1.3);      // o taco batendo na bola
  t('triangle', 190 + f * 120, 85, .07 + f * .05, .09 + f * .1); t('sine', 110 + f * 40, 55, .09 + f * .1, .05 + f * .12, .005);   // corpo e "pum"
  if (f > .6) t('square', 2400, 1500, .015, .03); }));
S('bola', G(7, (t, n, s) => { const v = cl01(gv());                                                 // v: velocidade do choque
  s('estalo', 'c6', .04, .35 + v * .4); n(.012 + v * .006, .35 + v * .25, 3600 + v * 1400, 0, null, 0, 2.2); t('sine', 2300 + v * 500, 1800, .02, .08 + v * .06); t('triangle', 1150, 800, .035, .08); }));
S('tabela', G(7, (t, n) => { const v = cl01(gv());                                                  // borracha da tabela: "tum" abafado
  n(.055 + v * .03, .3 + v * .15, 380 + v * 120, 0, null, 0, .9); t('sine', 150, 78, .08 + v * .04, .14 + v * .08); n(.01, .12, 2200, 0, null, 0, 1.5); }));
S('cacapa', G(1.6, (t, n, s) => { s('tom', 'a1', .25, .6); t('sine', 300, 620, .1, .08, .03); n(.18, .14, 320, .05, null, 0, .8, 'lowpass'); s('kalimba', 'e6', .12, .3); }));   // pum da bola caindo + "glup" + brilho de recompensa
S('rebatedor', G(2, (t, n, s) => { s('kalimba', 'e6', .12, .65); t('sine', 420, 1300, .1, .1); t('triangle', 900, 2200, .07, .05, .03); }));
S('falta', G(2.5, t => { t('sawtooth', 220, 200, .14, .06); t('square', 222, 198, .14, .04); t('sawtooth', 165, 150, .22, .06, .13); t('square', 166, 148, .22, .04, .13); }));
S('ui', G(6, t => t('triangle', 1500, 1250, .025, .05)));
S('ui_ok', G(1.6, (t, n, s) => { s('kalimba', 'b5', .1, .6); t('sine', 1976, 1976, .06, .04, .05); }));
S('ui_volta', G(1.6, (t, n, s) => { s('kalimba', 'e5', .1, .5); t('sine', 660, 440, .06, .03); }));
S('erro', G(3, t => { t('square', 150, 120, .12, .05); t('square', 140, 112, .14, .04); }));
S('comprar', G(1.8, (t, n, s) => { s('sinos', 'e6', .3, .45); t('square', 1319, 1319, .05, .035); t('square', 1760, 1760, .2, .035, .06); }));          // "ka-ching"
S('vitoria', G(1.2, (t, n, s) => { n(.7, .1, 1500, 0, null, 0, .7); s('sinos', 'c6', .6, .4); s('orq_hit', 'c4', .5, .45); }));                      // palmas da plateia + brilho + golpe, na tonalidade da fanfarra (Dó)
S('derrota', G(1.2, (t, n, s) => { s('timpano', 'g2', .8, .7); n(.6, .1, 480, 0, null, 0, .7); }));                                                  // "aaah" da plateia + tímpano, na tonalidade da derrota (Sol menor)
S('dialogo_passa', G(8, t => t('triangle', 1100, 800, .035, .05)));
/* ---- 2.0 (mundo LUA) ---- */
S('poco', G(.7, (t, n, s) => { const f = cl01(gv());                                               // bola perto de um poço gravitacional: zumbido grave e fofo (f: quanto mais perto, mais agudo e forte)
  s('baixo', nn_(29 + Math.round(f * 5)), .34, .3 + f * .2);                                         // baixo sintético sustentado (o "uóóóm")
  t('sine', 58 + f * 18, 52 + f * 12, .42, .12 + f * .1); t('sine', 61 + f * 18, 54 + f * 12, .42, .1 + f * .08, .01);              // dois senos desafinados: o zumbido bate devagar
  n(.36, .1 + f * .06, 150 + f * 60, 0, null, 0, .7, 'lowpass'); }));                                // ar do fundo do poço
S('fader', G(3, (t, n, s) => { s('estalo', 'c5', .04, .55); n(.04, .5, 2400, 0, null, 0, 1.2); t('triangle', 420, 110, .06, .12);      // estalo de corte do fader: clique seco com um "tump" curto embaixo
  t('square', 1500, 240, .05, .05, .004); }));
S('mare', G(3.2, (t, n, s) => { n(.34, .1, 380, 0, null, 0, .6, 'lowpass'); n(.5, .14, 620, .12, null, 0, .6, 'lowpass'); n(.45, .07, 900, .3, null, 0, .7, 'lowpass');   // ondinha: a água sobe, quebra e escorre
  s('kalimba', 'g5', .18, .24, -.2); s('kalimba', 'e5', .2, .2, .2); t('sine', 360, 760, .14, .035, .14); t('sine', 700, 300, .2, .03, .3); }));
S('martelo', G(2.4, (t, n, s) => { s('estalo', 'f4', .06, .95); n(.035, .8, 1900, 0, null, 0, 1.3); t('triangle', 240, 62, .1, .24); t('sine', 130, 48, .16, .28, .004);          // martelo do Síndico: impacto seco...
  s('estalo', 'f4', .05, .3, .3); n(.03, .25, 1900, .1, null, 0, 1.3); t('sine', 120, 52, .09, .09, .1); s('estalo', 'f4', .04, .12, -.3); t('sine', 110, 55, .07, .04, .2); }));   // ...e dois ecos curtos da sala

}
